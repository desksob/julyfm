<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>July Radio · Studio Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<!--
  JULY RADIO STUDIO DISPLAY (8 Nov 2026, july.rip style)
  For the 65" studio TV (any 16:9 screen). Sized in rem: 1rem = 1/192 of the screen width.
  Windows like july.rip (black title bar, 1px border), with show covers from the schedule.
  Options: ?theme=dark (the site's dark mode), ?tv=0 (hide the TV window).
-->
<style>
:root{ --bg:#ffffff; --ink:#0a0a0a; --border:#0a0a0a; --muted:#6e6e6e; --dim:#b0b0b0; --hair:#e2e2e2; --logo-filter:none; }
html[data-theme="dark"]{ --bg:#0a0a0a; --ink:#f5f5f5; --border:#f5f5f5; --muted:#8a8a8a; --dim:#555; --hair:#262626; --logo-filter:invert(1); }
*{ box-sizing:border-box; margin:0; padding:0; }
html{ font-size:min(calc(100vw / 192), calc(100vh / 108)); background:var(--bg); }
body{ background:var(--bg); color:var(--ink); font-family:'IBM Plex Mono','Courier New',monospace; height:100vh; overflow:hidden; cursor:none; display:flex; align-items:center; justify-content:center; }
.stage{ width:192rem; height:108rem; padding:2.4rem 4.8rem 4.8rem; display:flex; flex-direction:column; gap:3rem; transition:transform 2s ease; }
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.2;} }
.live-dot{ display:inline-block; width:1.1rem; height:1.1rem; border-radius:50%; background:currentColor; animation:pulse 1.4s ease-in-out infinite; flex-shrink:0; }
.fade{ transition:opacity .6s ease; }
.fading{ opacity:0; }
.cover{ background:var(--hair); overflow:hidden; flex-shrink:0; }
.cover img{ width:100%; height:100%; object-fit:cover; display:block; }

/* HEADER */
header{ display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); padding-bottom:2rem; }
header img{ height:10rem; margin:-1.6rem -1.9rem; filter:var(--logo-filter); }
.head-right{ display:flex; align-items:center; gap:3.2rem; }
.onair-pill{ display:flex; align-items:center; gap:1.2rem; background:var(--ink); color:var(--bg); padding:1rem 2rem; font-size:1.6rem; letter-spacing:.16em; text-transform:uppercase; }
.onair-pill.off{ background:var(--bg); color:var(--muted); border:1px solid var(--border); }
.onair-pill.off .live-dot{ animation:none; }
.clock{ text-align:right; }
.clock-time{ font-size:4.4rem; font-weight:500; line-height:1; font-variant-numeric:tabular-nums; }
.clock-time small{ font-size:2.4rem; color:var(--dim); margin-left:.4rem; }
.clock-date{ font-size:1.4rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-top:.8rem; }

/* WINDOWS (as on july.rip) */
.grid{ flex:1; min-height:0; display:grid; grid-template-columns:112rem 1fr; gap:3rem; }
.col{ display:flex; flex-direction:column; gap:3rem; min-height:0; }
.row2{ display:grid; grid-template-columns:48rem 1fr; gap:3rem; flex:1; min-height:0; }
.win{ border:1px solid var(--border); background:var(--bg); display:flex; flex-direction:column; min-height:0; overflow:hidden; }
.win.fill{ flex:1; }
.win-titlebar{ display:flex; align-items:center; gap:1rem; background:var(--ink); color:var(--bg); padding:1.1rem 1.8rem; flex-shrink:0; font-size:1.5rem; letter-spacing:.14em; text-transform:uppercase; white-space:nowrap; }
.win-body{ padding:2.4rem; flex:1; min-height:0; overflow:hidden; }

/* NOW PLAYING */
.np{ display:flex; gap:4rem; align-items:center; height:100%; }
.np .cover{ width:48rem; height:48rem; border:1px solid var(--border); }
.np-text{ flex:1; min-width:0; }
.np-mode{ display:inline-block; margin-bottom:2.4rem; font-size:1.4rem; letter-spacing:.16em; text-transform:uppercase; border:1px solid var(--border); padding:.6rem 1.4rem; }
.track-title{ font-size:6.6rem; font-weight:600; text-transform:uppercase; line-height:1.06; overflow:hidden; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; word-break:break-word; }
.track-artist{ font-size:2.8rem; color:var(--muted); margin-top:2.4rem; letter-spacing:.04em; text-transform:uppercase; }
.track-album{ font-size:1.9rem; color:var(--dim); margin-top:1rem; letter-spacing:.04em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tags{ display:flex; gap:1rem; flex-wrap:wrap; margin-top:2.4rem; }
.tag{ font-size:1.4rem; padding:.5rem 1.2rem; border:1px solid var(--border); letter-spacing:.1em; text-transform:uppercase; }

/* ON AIR NOW (show cover, as the site's On Air card) */
.onair{ display:flex; flex:1; min-height:0; }
.onair .cover{ width:auto; height:100%; aspect-ratio:1/1; border-right:1px solid var(--border); }
.onair-text{ flex:1; min-width:0; padding:2.4rem; display:flex; flex-direction:column; justify-content:center; }
.onair-name{ font-size:3.4rem; font-weight:600; text-transform:uppercase; line-height:1.1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; word-break:break-word; }
.onair-time{ font-size:1.6rem; color:var(--muted); margin-top:1.4rem; letter-spacing:.1em; text-transform:uppercase; }

/* UP NEXT (as the schedule page, with show covers) */
.day-label{ font-size:1.3rem; letter-spacing:.16em; text-transform:uppercase; color:var(--bg); background:var(--ink); padding:.6rem 1.4rem; margin:1.6rem 0 .2rem; }
.day-label:first-child{ margin-top:0; }
.show-row{ display:flex; align-items:center; gap:1.8rem; padding:1rem 0; border-bottom:1px solid var(--hair); }
.show-row .cover{ width:5.6rem; height:5.6rem; border:1px solid var(--border); }
.show-info{ flex:1; min-width:0; }
.show-name{ font-size:1.9rem; font-weight:500; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.show-time{ font-size:1.5rem; color:var(--muted); margin-top:.3rem; font-variant-numeric:tabular-nums; }
.empty{ font-size:1.7rem; color:var(--muted); letter-spacing:.1em; }

/* TV */
.tv-box{ position:relative; width:100%; aspect-ratio:16/9; background:#000; flex-shrink:0; }
.tv-box video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.tv-msg{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:1.6rem; letter-spacing:.16em; text-transform:uppercase; color:#8a8a8a; }

/* RECENTLY PLAYED */
.history-item{ display:flex; align-items:center; gap:1.8rem; padding:1.2rem 0; border-bottom:1px solid var(--hair); }
.history-item .cover{ width:6.4rem; height:6.4rem; }
.h-text{ flex:1; min-width:0; }
.h-title{ font-size:1.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.h-artist{ font-size:1.6rem; color:var(--muted); margin-top:.3rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.h-time{ font-size:1.4rem; color:var(--dim); flex-shrink:0; }

/* OFFLINE (admin "Server Status") */
.offline{ display:none; background:var(--ink); color:var(--bg); font-size:1.9rem; letter-spacing:.14em; text-transform:uppercase; text-align:center; padding:1.2rem; }
.offline.show{ display:block; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <header>
    <img src="https://july.rip/july-radio-logo-header.png" alt="July Radio">
    <div class="head-right">
      <div class="onair-pill" id="onairPill"><span class="live-dot"></span><span id="onairText">On Air</span></div>
      <div class="clock"><div class="clock-time" id="clockTime">--:--</div><div class="clock-date" id="clockDate">Nairobi · EAT</div></div>
    </div>
  </header>
  <div class="offline" id="offline"></div>

  <div class="grid">
    <div class="col">
      <div class="win" style="height:59rem;">
        <div class="win-titlebar" id="npTitle">Now Playing</div>
        <div class="win-body" style="padding:3rem;">
          <div class="np">
            <div class="cover fade" id="albumArt"></div>
            <div class="np-text">
              <div class="np-mode" id="npMode" style="display:none;">DJ Set</div>
              <div class="track-title fade" id="trackTitle">July Radio</div>
              <div class="track-artist fade" id="trackArtist">-</div>
              <div class="track-album fade" id="trackAlbum"></div>
              <div class="tags" id="trackTags"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="row2">
        <div class="win">
          <div class="win-titlebar"><span class="live-dot"></span>On Air Now</div>
          <div class="onair">
            <div class="cover" id="showCover"></div>
            <div class="onair-text"><div class="onair-name" id="showName">-</div><div class="onair-time" id="showTime"></div></div>
          </div>
        </div>
        <div class="win">
          <div class="win-titlebar">Up Next</div>
          <div class="win-body" id="schedBox" style="padding:2rem 2.4rem;"><div id="schedList"><div class="empty">Loading schedule…</div></div></div>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="win" id="tvWin">
        <div class="win-titlebar">July Music Television</div>
        <div class="tv-box"><video id="tvVideo" muted autoplay playsinline></video><div class="tv-msg" id="tvMsg">Connecting…</div></div>
      </div>
      <div class="win fill">
        <div class="win-titlebar">Recently Played</div>
        <div class="win-body" id="histBox" style="padding:1.2rem 2.4rem;"><div id="history"></div></div>
      </div>
    </div>
  </div>
</div>

<script>
const WORKER = 'https://julyimages.sxrsq1.workers.dev';
const LASTFM_KEY = '1a71ac0b1d0df8175df73ee9ac362919';
const LASTFM_USER = 'injeton';
const TV_URL = 'https://tv.july.rip/iptv/channel/10.m3u8';
const HOSTS = ['c', 'fziwe', 'fiscia'];
const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const params = new URLSearchParams(location.search);
if (params.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
if (params.get('tv') === '0') document.getElementById('tvWin').style.display = 'none';

function escH(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function safeUrl(u) { u = String(u == null ? '' : u).trim(); return /^https:\/\//i.test(u) ? escH(u) : ''; }
const coverHtml = u => safeUrl(u) ? '<img src="' + safeUrl(u) + '" alt="">' : '';
const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));

// ── CLOCK (Nairobi time) ──
function eatParts() {
  const p = {};
  new Intl.DateTimeFormat('en-GB', { timeZone:'Africa/Nairobi', weekday:'long', day:'numeric', month:'long', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false })
    .formatToParts(new Date()).forEach(x => { p[x.type] = x.value; });
  if (p.hour === '24') p.hour = '00';
  return p;
}
function eatNow() {
  const p = eatParts();
  return { day: DAY_NAMES.indexOf(p.weekday), mins: parseInt(p.hour, 10) * 60 + parseInt(p.minute, 10) };
}
function tickClock() {
  const p = eatParts();
  $('clockTime').innerHTML = p.hour + ':' + p.minute + '<small>' + p.second + '</small>';
  $('clockDate').textContent = p.weekday + ' ' + p.day + ' ' + p.month + ' · Nairobi';
}

// ── NOW PLAYING (DJ set from the admin, otherwise Last.fm) ──
let lastKey = '';
async function setNow(key, d) {
  if (key === lastKey) return;
  lastKey = key;
  const els = ['albumArt','trackTitle','trackArtist','trackAlbum'].map($);
  els.forEach(e => e.classList.add('fading'));
  await wait(600);
  $('npTitle').textContent = d.dj ? 'Live DJ Set' : 'Now Playing';
  $('npMode').style.display = d.dj ? 'inline-block' : 'none';
  $('trackTitle').textContent = d.title || 'July Radio';
  $('trackArtist').textContent = d.artist || '-';
  $('trackAlbum').textContent = d.album || '';
  $('trackTags').innerHTML = (d.tags || []).slice(0, 4).map(t => '<span class="tag">' + escH(t) + '</span>').join('');
  $('albumArt').innerHTML = coverHtml(d.image);
  els.forEach(e => e.classList.remove('fading'));
}
function timeAgo(u) {
  const d = Math.floor(Date.now() / 1000) - u;
  if (d < 60) return 'just now';
  if (d < 3600) return Math.floor(d / 60) + ' min ago';
  if (d < 86400) return Math.floor(d / 3600) + ' hr ago';
  return Math.floor(d / 86400) + 'd ago';
}
function bestImage(imgs) {
  for (const s of ['extralarge','large','medium','small']) { const i = (imgs || []).find(x => x.size === s); if (i && i['#text']) return i['#text']; }
  return '';
}
async function refreshNow() {
  let mode = 'lastfm', dj = null;
  try { const m = await (await fetch(WORKER + '/mode', { cache:'no-store' })).json(); mode = m.mode || 'lastfm'; dj = m.djset; } catch (e) {}
  let tracks = [];
  try {
    const r = await (await fetch('https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=' + LASTFM_USER + '&api_key=' + LASTFM_KEY + '&format=json&limit=10')).json();
    tracks = (r.recenttracks && r.recenttracks.track) || [];
  } catch (e) {}
  if (mode === 'djset' && dj && dj.title) {
    await setNow('dj:' + dj.title + '|' + (dj.djName || ''), {
      dj: true, title: dj.title, artist: dj.djName ? (dj.role || 'DJ') + ' · ' + dj.djName : 'Live DJ Set', image: dj.image, tags: dj.tags
    });
  } else if (tracks.length) {
    const c = tracks[0];
    await setNow('lf:' + c.name + '|' + c.artist['#text'], {
      title: c.name, artist: c.artist['#text'], album: (c.album && c.album['#text']) || '', image: bestImage(c.image)
    });
  }
  const live = tracks[0] && tracks[0]['@attr'] && tracks[0]['@attr'].nowplaying === 'true';
  const hist = tracks.slice(live ? 1 : 0, (live ? 1 : 0) + 9);
  $('history').innerHTML = hist.map(t =>
    '<div class="history-item"><div class="cover">' + coverHtml(bestImage(t.image)) + '</div>' +
    '<div class="h-text"><div class="h-title">' + escH(t.name) + '</div><div class="h-artist">' + escH(t.artist['#text']) + '</div></div>' +
    '<div class="h-time">' + (t.date ? timeAgo(parseInt(t.date.uts, 10)) : '') + '</div></div>'
  ).join('');
  fitList($('histBox'), $('history'));
}

// Removes rows from the end until the list fits its window (never a half-cut row on the TV)
function fitList(box, list) {
  const limit = box.getBoundingClientRect().bottom - parseFloat(getComputedStyle(box).paddingBottom);
  while (list.children.length > 1 && list.lastElementChild.getBoundingClientRect().bottom > limit) list.lastElementChild.remove();
  if (list.lastElementChild && list.lastElementChild.classList.contains('day-label')) list.lastElementChild.remove();
}

// ── SCHEDULE (EAT, same data as july.rip/schedule, with show covers) ──
let slots = [];
async function loadSchedule() {
  const all = [];
  for (const host of HOSTS) {
    try {
      const d = await (await fetch(WORKER + '/schedule?host=' + host, { cache:'no-store' })).json();
      (d.slots || []).forEach(s => {
        const sp = (s.start || '00:00').split(':'), ep = (s.end || '02:00').split(':');
        let end = parseInt(ep[0], 10) * 60 + parseInt(ep[1] || 0, 10);
        if (end === 0) end = 1440;
        all.push({ day: parseInt(s.day, 10), start: parseInt(sp[0], 10) * 60 + parseInt(sp[1] || 0, 10), end,
          startStr: s.start || '00:00', endStr: s.end || '02:00', name: s.name || '', image: s.image || '' });
      });
    } catch (e) {}
  }
  slots = all;
  renderSchedule();
}
const slotTime = s => (s.start === 0 && s.end === 1440) ? 'All day' : s.startStr + ' – ' + s.endStr + ' EAT';
let lastShow = null;
function renderSchedule() {
  const { day, mins } = eatNow();
  const current = slots.find(s => s.day === day && mins >= s.start && mins < s.end) || null;
  const showKey = current ? current.name + '|' + current.image + '|' + current.start : '';
  if (showKey !== lastShow) {
    lastShow = showKey;
    $('showName').textContent = current ? current.name : 'July Radio';
    $('showTime').textContent = current ? slotTime(current) : '24/7 from Nairobi';
    $('showCover').innerHTML = coverHtml(current && current.image);
  }
  let html = '';
  for (let off = 0; off < 2; off++) {
    const d = (day + off) % 7;
    const list = slots.filter(s => s.day === d && (off > 0 || s.start > mins)).sort((a, b) => a.start - b.start);
    if (!list.length) continue;
    html += '<div class="day-label">' + (off === 0 ? 'Later today' : 'Tomorrow · ' + DAY_NAMES[d]) + '</div>';
    list.forEach(s => {
      html += '<div class="show-row"><div class="cover">' + coverHtml(s.image) + '</div>' +
        '<div class="show-info"><div class="show-name">' + escH(s.name) + '</div><div class="show-time">' + escH(slotTime(s)) + '</div></div></div>';
    });
  }
  const list = $('schedList');
  list.innerHTML = html || '<div class="empty">No more shows scheduled.</div>';
  fitList($('schedBox'), list);
}

// ── STATION OFFLINE (admin "Server Status") ──
async function checkOffline() {
  try {
    const d = await (await fetch(WORKER + '/profile?host=_offline', { cache:'no-store' })).json();
    const on = !!(d && d.on);
    $('onairPill').classList.toggle('off', on);
    $('onairText').textContent = on ? 'Off Air' : 'On Air';
    $('offline').classList.toggle('show', on);
    $('offline').textContent = on ? ((d.message || 'Station offline') + (d.backAt ? ' · back ' + d.backAt : '')) : '';
  } catch (e) {}
}

// ── JULY MUSIC TELEVISION (muted) ──
let hls = null;
function startTv() {
  if (params.get('tv') === '0') return;
  const v = $('tvVideo'), msg = $('tvMsg');
  const fail = () => { msg.style.display = 'flex'; msg.textContent = 'TV offline · retrying'; if (hls) { hls.destroy(); hls = null; } setTimeout(startTv, 60000); };
  msg.style.display = 'flex'; msg.textContent = 'Connecting…';
  v.onplaying = () => { msg.style.display = 'none'; };
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls({ liveSyncDurationCount: 3 });
    hls.on(Hls.Events.ERROR, (e, data) => { if (data.fatal) fail(); });
    hls.loadSource(TV_URL);
    hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(() => {}));
  } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
    v.src = TV_URL; v.onerror = fail; v.play().catch(() => {});
  } else { msg.textContent = 'TV preview not supported'; }
}

// ── KEEP THE TV HAPPY: no sleep, slow drift against screen burn-in, refresh every 6 h ──
async function keepAwake() { try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });
let drift = 0;
setInterval(() => { drift = (drift + 1) % 4; const p = [[0,0],[6,4],[0,8],[-6,4]][drift]; $('stage').style.transform = 'translate(' + p[0] + 'px,' + p[1] + 'px)'; }, 120000);
setTimeout(() => location.reload(), 6 * 3600 * 1000);

tickClock(); setInterval(tickClock, 1000);
refreshNow(); setInterval(refreshNow, 15000);
loadSchedule(); setInterval(loadSchedule, 5 * 60000); setInterval(renderSchedule, 30000);
checkOffline(); setInterval(checkOffline, 30000);
startTv(); keepAwake();
</script>
</body>
</html>
