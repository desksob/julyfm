<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>July Radio Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
    font-family: 'DM Mono', monospace;
  }

  #bgBlur {
    position: absolute;
    inset: -60px;
    background-size: cover;
    background-position: center;
    filter: blur(80px) saturate(0.35) brightness(0.2);
    transition: background-image 2s ease;
    z-index: 0;
  }

  #darkOverlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1;
  }

  #ui {
    position: absolute;
    inset: 0;
    z-index: 2;
  }

  /* TOP LEFT — logo */
  #logo {
    position: absolute;
    top: 48px;
    left: 60px;
    height: 52px;
    width: auto;
  }


  #timezones {
    position: absolute;
    top: 48px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 24px;
    align-items: center;
  }

  .tz-item {
    text-align: center;
  }

  .tz-label { font-size: 9px; color: #333; letter-spacing: 0.15em; text-transform: uppercase; }
  .tz-time { font-size: 13px; color: #555; letter-spacing: 0.1em; margin-top: 2px; }
  .tz-sep { color: #222; font-size: 16px; }

  /* TOP RIGHT — live + listeners stacked */
  #topRight {
    position: absolute;
    top: 48px;
    right: 60px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }

  #livePill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,58,58,0.12);
    border: 1px solid rgba(255,58,58,0.4);
    padding: 6px 18px;
    border-radius: 2px;
    font-size: 13px;
    color: #ff3a3a;
    letter-spacing: 0.2em;
  }

  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #ff3a3a;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:0.3; transform:scale(0.8); }
  }

  #listeners span { color: #c8a96e; }

  /* BOTTOM LEFT — now playing */
  #nowPlaying {
    position: absolute;
    bottom: 60px;
    left: 60px;
    display: flex;
    align-items: center;
    gap: 20px;
    background: rgba(0,0,0,0.72);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 4px;
    padding: 20px 26px;
    transition: opacity 0.6s ease;
    max-width: 700px;
  }

  #nowPlaying.fading { opacity: 0; }

  #npArt {
    width: 72px; height: 72px;
    border-radius: 3px;
    border: 1px solid #1a1a1a;
    background: #111;
    flex-shrink: 0;
    overflow: hidden;
  }

  #npArt img { width: 100%; height: 100%; object-fit: cover; display: none; }

  .np-label { font-size: 10px; color: #555; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 6px; }
  #npTitle { font-size: 20px; color: #e0d9cc; text-transform: uppercase; letter-spacing: 0.04em; line-height: 1.2; }
  #npArtist { font-size: 13px; color: #c8a96e; margin-top: 5px; text-transform: uppercase; letter-spacing: 0.08em; }

  /* BOTTOM RIGHT — show */
  #showInfo {
    position: absolute;
    bottom: 60px;
    right: 60px;
    text-align: right;
    background: rgba(0,0,0,0.72);
    border: 1px solid rgba(255,58,58,0.5);
    border-radius: 4px;
    padding: 20px 26px;
    box-shadow: 0 0 0 1px rgba(255,58,58,0.15), 0 0 18px rgba(255,58,58,0.2), inset 0 0 12px rgba(255,58,58,0.04);
    animation: liveGlow 2.5s ease-in-out infinite;
  }

  @keyframes liveGlow {
    0%, 100% { box-shadow: 0 0 0 1px rgba(255,58,58,0.15), 0 0 18px rgba(255,58,58,0.2), inset 0 0 12px rgba(255,58,58,0.04); border-color: rgba(255,58,58,0.5); }
    50% { box-shadow: 0 0 0 1px rgba(255,58,58,0.3), 0 0 32px rgba(255,58,58,0.35), inset 0 0 16px rgba(255,58,58,0.08); border-color: rgba(255,58,58,0.8); }
  }

  .show-label { font-size: 10px; color: #ff3a3a; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 6px; }
  #showName { font-size: 20px; color: #e0d9cc; letter-spacing: 0.05em; }
  #showTime { font-size: 11px; color: #555; margin-top: 5px; letter-spacing: 0.1em; }
  #showDesc { font-size: 11px; color: #444; margin-top: 6px; font-style: italic; letter-spacing: 0.03em; }




  /* CENTRE LEFT — artist card */
  #artistCard {
    position: absolute;
    top: 50%;
    right: 60px;
    transform: translateY(-50%);
    width: 340px;
    background: rgba(0,0,0,0.75);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 4px;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.8s ease;
  }

  #artistCard.visible { opacity: 1; }

  #artistImg {
    width: 100%;
    height: 200px;
    object-fit: cover;
    object-position: top;
    display: block;
    background: #111;
  }

  #artistImgPlaceholder {
    width: 100%;
    height: 200px;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: #2a2a2a;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  #artistInfo {
    padding: 16px 20px;
  }

  #artistName {
    font-size: 16px;
    color: #e0d9cc;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }

  #artistTags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .artist-tag {
    font-size: 9px;
    color: #555;
    border: 1px solid #2a2a2a;
    padding: 2px 8px;
    border-radius: 2px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  #artistBio {
    font-size: 11px;
    color: #444;
    line-height: 1.7;
    letter-spacing: 0.03em;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  #artistListeners {
    font-size: 10px;
    color: #333;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: 10px;
  }

  #artistListeners span { color: #c8a96e; }

  /* CENTRE LEFT — recent tracks */
  #recentTracks {
    position: absolute;
    top: 50%;
    left: 60px;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .recent-item {
    display: flex;
    align-items: center;
    gap: 12px;
    opacity: 0;
    transition: opacity 0.8s ease;
  }

  .recent-item.visible { opacity: 1; }

  .recent-art {
    width: 44px; height: 44px;
    border-radius: 2px;
    background: #111;
    border: 1px solid #1a1a1a;
    flex-shrink: 0;
    overflow: hidden;
  }

  .recent-art img { width: 100%; height: 100%; object-fit: cover; display: none; }

  .recent-track { font-size: 12px; color: #555; text-transform: uppercase; letter-spacing: 0.05em; max-width: 300px; }
  .recent-artist { font-size: 11px; color: #3a3a3a; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }

  /* BOTTOM — ticker */
  #ticker {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 36px;
    background: rgba(10,10,10,0.92);
    border-top: 1px solid rgba(255,255,255,0.08);
    overflow: hidden;
    display: flex;
    align-items: center;
  }

  #tickerLabel {
    font-size: 10px;
    color: #c8a96e;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0 20px;
    white-space: nowrap;
    border-right: 1px solid #333;
    flex-shrink: 0;
  }

  #tickerTrack {
    flex: 1;
    overflow: hidden;
    position: relative;
    height: 100%;
  }

  #tickerInner {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    white-space: nowrap;
    will-change: transform;
  }

  .ticker-msg {
    font-size: 11px;
    color: #ffffff;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* BOTTOM CENTER — clock */
  #clock {
    position: absolute;
    bottom: 68px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: #2a2a2a;
    letter-spacing: 0.2em;
  }
</style>
</head>
<body>

<div id="bgBlur"></div>
<div id="darkOverlay"></div>

<div id="ui">
  <img src="july-logo.png" alt="July Radio" id="logo">

  <div id="timezones">
    <div class="tz-item"><div class="tz-label">EAT</div><div class="tz-time" id="tzNairobi">—</div></div>
    <div class="tz-sep">·</div>
    <div class="tz-item"><div class="tz-label">BST</div><div class="tz-time" id="tzLondon">—</div></div>
    <div class="tz-sep">·</div>
    <div class="tz-item"><div class="tz-label">EST</div><div class="tz-time" id="tzNY">—</div></div>
  </div>

  <div id="topRight">
    <div id="livePill"><div class="dot"></div>LIVE</div>
    
  </div>

  <div id="nowPlaying">
    <div id="npArt"><img id="npImg" src="" alt=""></div>
    <div>
      <div class="np-label">Now Playing</div>
      <div id="npTitle">July Radio</div>
      <div id="npArtist">—</div>
    </div>
  </div>

  <div id="artistCard">
    <div id="artistImgWrap">
      <div id="artistImgPlaceholder">loading artist</div>
    </div>
    <div id="artistInfo">
      <div id="artistName">—</div>
      <div id="artistTags"></div>
      <div id="artistBio">—</div>
      <div id="artistListeners">—</div>
    </div>
  </div>

  <div id="showInfo">
    <div class="show-label">On Air</div>
    <div id="showName">—</div>
    <div id="showTime">—</div>
    <div id="showDesc"></div>
  </div>

  <div id="clock">—</div>

  <div id="recentTracks">
    <div style="font-size:10px;color:#2a2a2a;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:4px;">Recently played</div>
  </div>

  <div id="ticker">
    <div id="tickerLabel">July Radio</div>
    <div id="tickerTrack">
      <div id="tickerInner">
        <span class="ticker-msg">Welcome to July Radio &nbsp;·&nbsp; Live 24/7 &nbsp;·&nbsp; Now streaming</span>
      </div>
    </div>
  </div>
</div>

<script>
const LASTFM_KEY = '1a71ac0b1d0df8175df73ee9ac362919';
const LASTFM_USER = 'injeton';
let lastTrack = '';

let schedule = {};

async function fetchSchedule() {
  try {
    const hosts = ['c', 'fziwe', 'fiscia'];
    const allSlots = [];
    for (const host of hosts) {
      const res = await fetch('https://julyimages.sxrsq1.workers.dev/schedule?host=' + host);
      const data = await res.json();
      if (data.slots && data.slots.length) {
        data.slots.forEach(function(slot) {
          var sp = (slot.start || '00:00').split(':');
          var ep = (slot.end || '02:00').split(':');
          var endMins = parseInt(ep[0]) * 60 + parseInt(ep[1] || 0);
          if (endMins === 0) endMins = 1440; // 00:00 end means midnight = end of day
          allSlots.push({
            name: slot.name,
            description: slot.description || '',
            startMins: parseInt(sp[0]) * 60 + parseInt(sp[1] || 0),
            endMins: endMins,
            startStr: slot.start || '00:00',
            endStr: slot.end || '02:00',
            day: parseInt(slot.day)
          });
        });
      }
    }
    for (let d = 0; d < 7; d++) {
      schedule[d] = allSlots.filter(function(s) { return parseInt(s.day) === d; }).sort(function(a,b) { return a.startMins - b.startMins; });
    }
    updateShow();
    updateShow(); // ensure show info updates immediately
  } catch(e) {}
}

function pad(n) { return String(n).padStart(2,'0'); }

function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds()) + ' EAT';

  const fmt = function(tz) {
    return now.toLocaleTimeString('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit' });
  };
  const n = document.getElementById('tzNairobi');
  const l = document.getElementById('tzLondon');
  const ny = document.getElementById('tzNY');
  if (n) n.textContent = fmt('Africa/Nairobi');
  if (l) l.textContent = fmt('Europe/London');
  if (ny) ny.textContent = fmt('America/New_York');
}

function updateShow() {
  const now = new Date();
  const nowMins = now.getHours() * 60 + now.getMinutes();
  const todayShows = schedule[now.getDay()] || [];
  const show = todayShows.find(function(s) { return nowMins >= s.startMins && nowMins < s.endMins; });
  if (show) {
    document.getElementById('showName').textContent = show.name;
    document.getElementById('showTime').textContent = show.startStr + ' – ' + show.endStr;
    const descEl = document.getElementById('showDesc');
    if (descEl) descEl.textContent = show.description || '';
  } else {
    document.getElementById('showName').textContent = '—';
    document.getElementById('showTime').textContent = '';
    const descEl = document.getElementById('showDesc');
    if (descEl) descEl.textContent = '';
  }
}

async function getItunesArt(artist, track) {
  try {
    const q = encodeURIComponent(track + ' ' + artist);
    const res = await fetch('https://itunes.apple.com/search?term=' + q + '&media=music&limit=1');
    const data = await res.json();
    if (data.results && data.results.length > 0) {
      return data.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
    }
  } catch(e) {}
  return null;
}

function setArt(url) {
  const img = document.getElementById('npImg');
  const bg = document.getElementById('bgBlur');
  if (url) {
    const preload = new Image();
    preload.onload = function() {
      img.src = url;
      img.style.display = 'block';
      bg.style.backgroundImage = 'url(' + url + ')';
    };
    preload.src = url;
  }
}

async function checkMode() {
  try {
    const res = await fetch('https://julyimages.sxrsq1.workers.dev/mode');
    const data = await res.json();
    if (data.mode === 'djset' && data.djset) {
      const dj = data.djset;
      document.getElementById('npTitle').textContent = dj.title || 'DJ Set';
      document.getElementById('npArtist').textContent = dj.djName || 'C.';
      if (dj.image) {
        document.getElementById('npImg').src = dj.image;
        document.getElementById('npImg').style.display = 'block';
        document.getElementById('bgBlur').style.backgroundImage = 'url(' + dj.image + ')';
      }
      // Clear artist card in DJ mode
      document.getElementById('artistCard').classList.remove('visible');
      return true;
    }
  } catch(e) {}
  return false;
}

async function fetchNowPlaying() {
  const isDjMode = await checkMode();
  if (isDjMode) return;

  try {
    const url = 'https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=' + LASTFM_USER + '&api_key=' + LASTFM_KEY + '&format=json&limit=1';
    const res = await fetch(url);
    const data = await res.json();
    const tracks = data.recenttracks.track;
    if (!tracks || !tracks.length) return;

    const current = Array.isArray(tracks) ? tracks[0] : tracks;
    const trackName = current.name;
    const artistName = current.artist['#text'];
    const trackKey = trackName + artistName;

    if (trackKey !== lastTrack) {
      lastTrack = trackKey;

      const npEl = document.getElementById('nowPlaying');
      npEl.classList.add('fading');

      setTimeout(async function() {
        document.getElementById('npTitle').textContent = trackName;
        document.getElementById('npArtist').textContent = artistName;

        // Set Last.fm art immediately
        const lfmImages = current.image;
        const lfmArt = lfmImages && lfmImages.find(function(i) { return i.size === 'extralarge'; });
        if (lfmArt && lfmArt['#text']) {
          setArt(lfmArt['#text']);
        }

        // Try upgrade to iTunes high res
        const itunesArt = await getItunesArt(artistName, trackName);
        if (itunesArt) setArt(itunesArt);
        fetchArtistInfo(artistName);
        fetchRecentTracks();

        npEl.classList.remove('fading');
      }, 600);
    }
  } catch(e) {
    console.log('Last.fm error:', e);
  }
}


// Recent tracks
let recentHistory = [];
let lastRenderedHistory = '';

function timeAgo(unixTime) {
  const diff = Math.floor(Date.now() / 1000) - unixTime;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}

function getBestImage(images) {
  const sizes = ['extralarge', 'large', 'medium'];
  for (const size of sizes) {
    const img = images.find(function(i) { return i.size === size; });
    if (img && img['#text']) return img['#text'];
  }
  return null;
}

async function fetchRecentTracks() {
  try {
    const url = 'https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=' + LASTFM_USER + '&api_key=' + LASTFM_KEY + '&format=json&limit=6';
    const res = await fetch(url);
    const data = await res.json();
    const tracks = data.recenttracks.track;
    if (!tracks || !tracks.length) return;

    // Filter out currently playing track
    const history = tracks.filter(function(t) {
      return !(t['@attr'] && t['@attr']['nowplaying'] === 'true');
    }).slice(0, 4);

    const key = history.map(function(t) { return t.name + t.artist['#text']; }).join('|');
    if (key === lastRenderedHistory) return;
    lastRenderedHistory = key;

    recentHistory = history.map(function(t) {
      return {
        trackName: t.name,
        artistName: t.artist['#text'],
        artUrl: getBestImage(t.image),
        time: t.date ? timeAgo(parseInt(t.date.uts)) : '—'
      };
    });

    renderRecent();
  } catch(e) {}
}

function renderRecent() {
  const container = document.getElementById('recentTracks');
  const label = container.querySelector('div');
  container.innerHTML = '';
  container.appendChild(label);

  recentHistory.forEach(function(item) {
    const el = document.createElement('div');
    el.className = 'recent-item';
    el.innerHTML =
      '<div class="recent-art">' +
        (item.artUrl ? '<img src="' + item.artUrl + '" style="display:block">' : '') +
      '</div>' +
      '<div>' +
        '<div class="recent-track">' + item.trackName + '</div>' +
        '<div class="recent-artist">' + item.artistName + '</div>' +
        '<div class="recent-artist" style="color:#2a2a2a;margin-top:2px;">' + item.time + '</div>' +
      '</div>';
    container.appendChild(el);
    setTimeout(function() { el.classList.add('visible'); }, 50);
  });
}


async function fetchArtistInfo(artist) {
  try {
    const url = 'https://ws.audioscrobbler.com/2.0/?method=artist.getinfo&artist=' + encodeURIComponent(artist) + '&api_key=' + LASTFM_KEY + '&format=json';
    const res = await fetch(url);
    const data = await res.json();
    const a = data.artist;
    if (!a) return;

    const card = document.getElementById('artistCard');
    card.classList.remove('visible');

    setTimeout(function() {
      document.getElementById('artistName').textContent = a.name || artist;

      // Tags
      const tags = a.tags && a.tags.tag ? a.tags.tag.slice(0, 3) : [];
      document.getElementById('artistTags').innerHTML = tags.map(function(t) {
        return '<div class="artist-tag">' + t.name + '</div>';
      }).join('');

      // Bio — strip HTML tags
      const bioRaw = a.bio && a.bio.summary ? a.bio.summary : '';
      const bioClean = bioRaw.replace(/<a[^>]*>.*?<\/a>/g, '').replace(/<[^>]+>/g, '').trim();
      document.getElementById('artistBio').textContent = bioClean || '—';

      // Listeners
      const listeners = a.stats && a.stats.listeners ? parseInt(a.stats.listeners).toLocaleString() : '—';
      document.getElementById('artistListeners').innerHTML = '<span>' + listeners + '</span> monthly listeners';

      // Artist image via Cloudflare Worker proxy
      const imgWrap = document.getElementById('artistImgWrap');
      imgWrap.innerHTML = '<div id="artistImgPlaceholder">' + (a.name || artist) + '</div>';

      fetch('https://julyimages.sxrsq1.workers.dev/?artist=' + encodeURIComponent(a.name || artist))
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.image) {
            imgWrap.innerHTML = '<img id="artistImg" src="' + data.image + '" alt="' + (a.name || artist) + '">';
          }
        })
        .catch(function() {});

      card.classList.add('visible');
    }, 400);

  } catch(e) {
    console.log('Artist fetch error:', e);
  }
}


// Ticker — JS RAF scroll, auto-sizes to content
var tickerX = 0;
var tickerSpeed = 0.5;
var tickerRAF = null;
var tickerSingleWidth = 0;
var tickerSep = '     ·     ';

function setTickerText(messages) {
  var inner = document.getElementById('tickerInner');
  if (!inner) return;
  var text = messages.join(tickerSep);
  inner.innerHTML =
    '<span class="ticker-msg">' + text + tickerSep + '</span>' +
    '<span class="ticker-msg">' + text + tickerSep + '</span>';
  tickerX = 0;
  inner.style.transform = 'translateY(-50%) translateX(0px)';
  requestAnimationFrame(function() {
    var spans = inner.querySelectorAll('.ticker-msg');
    tickerSingleWidth = spans[0] ? spans[0].offsetWidth : 0;
    if (tickerRAF) cancelAnimationFrame(tickerRAF);
    tickerLoop();
  });
}

function tickerLoop() {
  var inner = document.getElementById('tickerInner');
  if (!inner || tickerSingleWidth === 0) return;
  tickerX -= tickerSpeed;
  if (tickerX <= -tickerSingleWidth) tickerX += tickerSingleWidth;
  inner.style.transform = 'translateY(-50%) translateX(' + tickerX + 'px)';
  tickerRAF = requestAnimationFrame(tickerLoop);
}

async function fetchTicker() {
  try {
    const res = await fetch('https://julyimages.sxrsq1.workers.dev/ticker');
    const data = await res.json();
    if (data.messages && data.messages.length) {
      setTickerText(data.messages);
    }
  } catch(e) {}
}
updateClock();
fetchSchedule();
fetchNowPlaying();
fetchTicker();
fetchRecentTracks();

setInterval(updateClock, 1000);
setInterval(fetchSchedule, 30000);

// Instant updates via BroadcastChannel
var bc = new BroadcastChannel('july');
bc.onmessage = function(e) {
  if (e.data && e.data.type === 'scheduleUpdate') fetchSchedule();
  if (e.data && e.data.type === 'tickerUpdate') fetchTicker();
};
setInterval(fetchNowPlaying, 15000);
setInterval(fetchTicker, 60000);
setInterval(fetchRecentTracks, 20000);
</script>
