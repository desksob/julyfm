<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>July Radio Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
    font-family: 'DM Mono', monospace;
  }

  #bgBlur {
    position: absolute;
    inset: -60px;
    background-size: cover;
    background-position: center;
    filter: blur(80px) saturate(0.35) brightness(0.2);
    transition: background-image 2s ease;
    z-index: 0;
  }

  #darkOverlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1;
  }

  #ui {
    position: absolute;
    inset: 0;
    z-index: 2;
  }

  /* TOP LEFT — logo */
  #logo {
    position: absolute;
    top: 48px;
    left: 60px;
    height: 52px;
    width: auto;
  }

  /* TOP RIGHT — live + listeners stacked */
  #topRight {
    position: absolute;
    top: 48px;
    right: 60px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }

  #livePill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,58,58,0.12);
    border: 1px solid rgba(255,58,58,0.4);
    padding: 6px 18px;
    border-radius: 2px;
    font-size: 13px;
    color: #ff3a3a;
    letter-spacing: 0.2em;
  }

  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #ff3a3a;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:0.3; transform:scale(0.8); }
  }

  #listeners {
    font-size: 11px;
    color: #555;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  #listeners span { color: #c8a96e; }

  /* BOTTOM LEFT — now playing */
  #nowPlaying {
    position: absolute;
    bottom: 60px;
    left: 60px;
    display: flex;
    align-items: center;
    gap: 20px;
    background: rgba(0,0,0,0.72);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 4px;
    padding: 20px 26px;
    transition: opacity 0.6s ease;
    max-width: 700px;
  }

  #nowPlaying.fading { opacity: 0; }

  #npArt {
    width: 72px; height: 72px;
    border-radius: 3px;
    border: 1px solid #1a1a1a;
    background: #111;
    flex-shrink: 0;
    overflow: hidden;
  }

  #npArt img { width: 100%; height: 100%; object-fit: cover; display: none; }

  .np-label { font-size: 10px; color: #555; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 6px; }
  #npTitle { font-size: 20px; color: #e0d9cc; text-transform: uppercase; letter-spacing: 0.04em; line-height: 1.2; }
  #npArtist { font-size: 13px; color: #c8a96e; margin-top: 5px; text-transform: uppercase; letter-spacing: 0.08em; }

  /* BOTTOM RIGHT — show */
  #showInfo {
    position: absolute;
    bottom: 60px;
    right: 60px;
    text-align: right;
    background: rgba(0,0,0,0.72);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 4px;
    padding: 20px 26px;
  }

  .show-label { font-size: 10px; color: #555; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 6px; }
  #showName { font-size: 20px; color: #e0d9cc; letter-spacing: 0.05em; }
  #showTime { font-size: 11px; color: #555; margin-top: 5px; letter-spacing: 0.1em; }

  /* BOTTOM CENTER — clock */
  #clock {
    position: absolute;
    bottom: 68px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: #2a2a2a;
    letter-spacing: 0.2em;
  }
</style>
</head>
<body>

<div id="bgBlur"></div>
<div id="darkOverlay"></div>

<div id="ui">
  <img src="july-logo.png" alt="July Radio" id="logo">

  <div id="topRight">
    <div id="livePill"><div class="dot"></div>LIVE</div>
    <div id="listeners"><span id="listenerCount">—</span> LISTENERS</div>
  </div>

  <div id="nowPlaying">
    <div id="npArt"><img id="npImg" src="" alt=""></div>
    <div>
      <div class="np-label">Now Playing</div>
      <div id="npTitle">July Radio</div>
      <div id="npArtist">—</div>
    </div>
  </div>

  <div id="showInfo">
    <div class="show-label">On Air</div>
    <div id="showName">—</div>
    <div id="showTime">—</div>
  </div>

  <div id="clock">—</div>
</div>

<script>
const LASTFM_KEY = '1a71ac0b1d0df8175df73ee9ac362919';
const LASTFM_USER = 'injeton';
let lastTrack = '';

const shows = [
  { name: 'Playlist',   start: 0,  end: 8  },
  { name: 'di:scovery', start: 8,  end: 12 },
  { name: 'Playlist',   start: 12, end: 14 },
  { name: 'Shuffle+',   start: 14, end: 16 },
  { name: 'in:focus',   start: 16, end: 18 },
  { name: 'Open Air',   start: 18, end: 20 },
  { name: 'Playlist',   start: 20, end: 24 },
];

function pad(n) { return String(n).padStart(2,'0'); }

function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds()) + ' EAT';
}

function updateShow() {
  const h = new Date().getHours();
  const show = shows.find(s => h >= s.start && h < s.end);
  if (show) {
    document.getElementById('showName').textContent = show.name;
    document.getElementById('showTime').textContent =
      pad(show.start) + ':00 – ' + pad(show.end === 24 ? 0 : show.end) + ':00';
  }
}

async function getItunesArt(artist, track) {
  try {
    const q = encodeURIComponent(track + ' ' + artist);
    const res = await fetch('https://itunes.apple.com/search?term=' + q + '&media=music&limit=1');
    const data = await res.json();
    if (data.results && data.results.length > 0) {
      return data.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
    }
  } catch(e) {}
  return null;
}

function setArt(url) {
  const img = document.getElementById('npImg');
  const bg = document.getElementById('bgBlur');
  if (url) {
    const preload = new Image();
    preload.onload = function() {
      img.src = url;
      img.style.display = 'block';
      bg.style.backgroundImage = 'url(' + url + ')';
    };
    preload.src = url;
  }
}

async function fetchNowPlaying() {
  try {
    const url = 'https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=' + LASTFM_USER + '&api_key=' + LASTFM_KEY + '&format=json&limit=1';
    const res = await fetch(url);
    const data = await res.json();
    const tracks = data.recenttracks.track;
    if (!tracks || !tracks.length) return;

    const current = Array.isArray(tracks) ? tracks[0] : tracks;
    const trackName = current.name;
    const artistName = current.artist['#text'];
    const trackKey = trackName + artistName;

    if (trackKey !== lastTrack) {
      lastTrack = trackKey;

      const npEl = document.getElementById('nowPlaying');
      npEl.classList.add('fading');

      setTimeout(async function() {
        document.getElementById('npTitle').textContent = trackName;
        document.getElementById('npArtist').textContent = artistName;

        // Set Last.fm art immediately
        const lfmImages = current.image;
        const lfmArt = lfmImages && lfmImages.find(function(i) { return i.size === 'extralarge'; });
        if (lfmArt && lfmArt['#text']) {
          setArt(lfmArt['#text']);
        }

        // Try upgrade to iTunes high res
        const itunesArt = await getItunesArt(artistName, trackName);
        if (itunesArt) setArt(itunesArt);

        npEl.classList.remove('fading');
      }, 600);
    }
  } catch(e) {
    console.log('Last.fm error:', e);
  }
}

updateClock();
updateShow();
fetchNowPlaying();

setInterval(updateClock, 1000);
setInterval(updateShow, 60000);
setInterval(fetchNowPlaying, 15000);
</script>
</body>
</html>
