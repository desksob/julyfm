
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0a; font-family: 'DM Mono', monospace; }

  .stream-frame {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    position: relative;
    overflow: hidden;
  }

  .bg-art {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 30% 40%, #1a0a2e 0%, #000 60%),
                radial-gradient(ellipse at 70% 60%, #0a1a0e 0%, transparent 50%);
    opacity: 0.9;
  }

  .noise {
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    opacity: 0.5;
  }

  .viz-area {
    position: absolute;
    bottom: 18%;
    left: 50%;
    transform: translateX(-50%);
    width: 70%;
    height: 14%;
    display: flex;
    align-items: flex-end;
    gap: 2px;
  }

  .viz-bar {
    flex: 1;
    background: rgba(200, 169, 110, 0.5);
    border-radius: 1px;
    animation: vb 1.2s ease-in-out infinite;
  }

  @keyframes vb {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(0.2); }
  }

  .top-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 2% 3%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo-area {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-text {
    font-size: clamp(12px, 2.5vw, 22px);
    color: #e0d9cc;
    letter-spacing: -0.03em;
    font-weight: 400;
  }

  .logo-text span { color: #c8a96e; font-style: italic; }

  .live-pill {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(255, 58, 58, 0.15);
    border: 1px solid rgba(255, 58, 58, 0.4);
    padding: 3px 8px;
    border-radius: 2px;
    font-size: clamp(8px, 1.2vw, 11px);
    color: #ff3a3a;
    letter-spacing: 0.15em;
  }

  .live-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #ff3a3a;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .now-playing-card {
    position: absolute;
    bottom: 6%;
    left: 3%;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(10,10,10,0.75);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 3px;
    padding: 8px 12px;
    backdrop-filter: blur(4px);
  }

  .np-art {
    width: clamp(28px, 5vw, 48px);
    height: clamp(28px, 5vw, 48px);
    background: #1a1a1a;
    border-radius: 2px;
    border: 1px solid #2a2a2a;
    flex-shrink: 0;
    overflow: hidden;
  }

  .np-art-inner {
    width: 100%; height: 100%;
    background: linear-gradient(135deg, #2a1a3a, #1a2a1a);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #444;
  }

  .np-text {}
  .np-label { font-size: clamp(7px, 1vw, 9px); color: #555; letter-spacing: 0.15em; text-transform: uppercase; }
  .np-title { font-size: clamp(9px, 1.5vw, 13px); color: #e0d9cc; margin-top: 2px; letter-spacing: 0.03em; text-transform: uppercase; }
  .np-artist { font-size: clamp(8px, 1.2vw, 11px); color: #c8a96e; margin-top: 1px; text-transform: uppercase; }

  .show-card {
    position: absolute;
    bottom: 6%;
    right: 3%;
    background: rgba(10,10,10,0.75);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 3px;
    padding: 8px 12px;
    text-align: right;
    backdrop-filter: blur(4px);
  }

  .show-label { font-size: clamp(7px, 1vw, 9px); color: #555; letter-spacing: 0.15em; text-transform: uppercase; }
  .show-name { font-size: clamp(10px, 1.6vw, 14px); color: #e0d9cc; margin-top: 2px; letter-spacing: 0.05em; }
  .show-time { font-size: clamp(8px, 1.1vw, 10px); color: #555; margin-top: 2px; letter-spacing: 0.1em; }

  .listener-badge {
    position: absolute;
    top: 14%;
    right: 3%;
    font-size: clamp(8px, 1.1vw, 10px);
    color: #555;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .listener-count { color: #c8a96e; }

  .center-logo {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    opacity: 0.07;
  }

  .center-logo-text {
    font-size: clamp(30px, 8vw, 80px);
    color: #fff;
    letter-spacing: -0.04em;
    font-style: italic;
  }

  .twitch-bar {
    background: #18181b;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .twitch-left { display: flex; align-items: center; gap: 8px; }
  .twitch-avatar { width: 24px; height: 24px; border-radius: 50%; background: #9147ff; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #fff; flex-shrink: 0; }
  .twitch-name { font-size: 12px; color: #efeff1; font-family: sans-serif; }
  .twitch-tag { font-size: 10px; color: #adadb8; font-family: sans-serif; margin-left: 4px; }
  .twitch-right { display: flex; align-items: center; gap: 12px; }
  .twitch-viewers { font-size: 11px; color: #adadb8; font-family: sans-serif; display: flex; align-items: center; gap: 4px; }
  .twitch-red { width: 6px; height: 6px; background: #eb0400; border-radius: 50%; }
  .twitch-follow { background: #9147ff; color: #fff; border: none; border-radius: 4px; padding: 4px 10px; font-size: 11px; font-family: sans-serif; cursor: pointer; }

  .label {
    position: absolute;
    font-size: clamp(7px, 1vw, 9px);
    color: #555;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    background: rgba(0,0,0,0.6);
    padding: 2px 6px;
    border-radius: 2px;
    border: 1px solid #1a1a1a;
  }
</style>

<div style="padding: 0;">
  <div class="stream-frame">
    <div class="bg-art"></div>
    <div class="noise"></div>

    <div class="center-logo">
      <div class="center-logo-text">July</div>
    </div>

    <div class="viz-area" id="vizArea"></div>

    <div class="top-bar">
      <div class="logo-area">
        <div class="logo-text">July <span>Radio</span></div>
      </div>
      <div class="live-pill"><div class="live-dot"></div>LIVE</div>
    </div>

    <div class="listener-badge"><span class="listener-count">24</span> LISTENERS</div>

    <div class="now-playing-card">
      <div class="np-art"><div class="np-art-inner">♪</div></div>
      <div class="np-text">
        <div class="np-label">Now playing</div>
        <div class="np-title">Pearly-Dewdrops' Drops</div>
        <div class="np-artist">Cocteau Twins</div>
      </div>
    </div>

    <div class="show-card">
      <div class="show-label">Current show</div>
      <div class="show-name">Open Air</div>
      <div class="show-time">18:00 – 20:00</div>
    </div>

    <div class="label" style="top: 14%; left: 3%;">OBS Browser Source</div>
    <div class="label" style="bottom: 36%; left: 3%; color: #444; border-color: #111;">← Album art (Last.fm)</div>
    <div class="label" style="bottom: 36%; right: 3%; color: #444; border-color: #111;">Schedule →</div>
  </div>

  <div class="twitch-bar">
    <div class="twitch-left">
      <div class="twitch-avatar">J</div>
      <span class="twitch-name">julyradio</span>
      <span class="twitch-tag">· Music</span>
    </div>
    <div class="twitch-right">
      <div class="twitch-viewers"><div class="twitch-red"></div>24 viewers</div>
      <button class="twitch-follow">Follow</button>
    </div>
  </div>
</div>

<script>
const vizArea = document.getElementById('vizArea');
const N = 48;
const bars = [];
const heights = [];
const targets = [];

for (let i = 0; i < N; i++) {
  const b = document.createElement('div');
  b.className = 'viz-bar';
  const h = 20 + Math.random() * 80;
  b.style.height = h + '%';
  b.style.animationDelay = (Math.random() * 1.2) + 's';
  b.style.animationDuration = (0.7 + Math.random() * 0.8) + 's';
  vizArea.appendChild(b);
  bars.push(b);
  heights.push(Math.random());
  targets.push(Math.random());
}

setInterval(() => {
  for (let i = 0; i < N; i++) {
    if (Math.random() < 0.1) targets[i] = 0.1 + Math.random() * 0.9;
    heights[i] += (targets[i] - heights[i]) * 0.15;
    bars[i].style.height = (heights[i] * 90 + 5) + '%';
  }
}, 50);
</script>
