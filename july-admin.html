<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>July Radio — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    color: #e0d9cc;
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 480px;
    border: 1px solid #1a1a1a;
    border-radius: 4px;
    overflow: hidden;
  }

  .card-header {
    padding: 24px 28px;
    border-bottom: 1px solid #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-title {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    color: #e0d9cc;
    font-style: italic;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #333;
  }

  .status-dot.live { background: #c8a96e; animation: pulse 2s ease-in-out infinite; }
  .status-dot.dj { background: #ff3a3a; animation: pulse 2s ease-in-out infinite; }

  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .card-body { padding: 28px; }

  /* Login */
  #loginView, #adminView { display: none; }
  #loginView.active, #adminView.active { display: block; }

  .field { margin-bottom: 20px; }

  .field-label {
    font-size: 10px;
    color: #555;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 8px;
    display: block;
  }

  input[type=password], input[type=text], input[type=url], textarea {
    width: 100%;
    background: #111;
    border: 1px solid #222;
    border-radius: 2px;
    color: #e0d9cc;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus, textarea:focus { border-color: #c8a96e; }
  textarea { resize: vertical; min-height: 60px; }

  .btn {
    width: 100%;
    background: transparent;
    border: 1px solid #c8a96e;
    color: #c8a96e;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 12px;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn:hover { background: #c8a96e; color: #0a0a0a; }
  .btn.danger { border-color: #ff3a3a; color: #ff3a3a; }
  .btn.danger:hover { background: #ff3a3a; color: #0a0a0a; }
  .btn.active-mode { background: #c8a96e22; }

  /* Mode toggle */
  .mode-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: #1a1a1a;
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 24px;
  }

  .mode-btn {
    background: #0a0a0a;
    border: none;
    color: #555;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .mode-btn.active { background: #111; color: #e0d9cc; }
  .mode-btn:hover { color: #888; }

  #djFields { display: none; }
  #djFields.visible { display: block; }

  .current-mode {
    font-size: 11px;
    color: #555;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .current-mode span { color: #c8a96e; }

  .divider {
    height: 1px;
    background: #1a1a1a;
    margin: 24px 0;
  }

  .msg {
    font-size: 11px;
    padding: 10px 14px;
    border-radius: 2px;
    margin-bottom: 16px;
    display: none;
  }

  .msg.success { background: #0a1a0a; border: 1px solid #1a3a1a; color: #4a8a4a; display: block; }
  .msg.error { background: #1a0a0a; border: 1px solid #3a1a1a; color: #8a4a4a; display: block; }

  .preview-img {
    width: 100%;
    height: 120px;
    object-fit: cover;
    border-radius: 2px;
    border: 1px solid #1a1a1a;
    margin-top: 8px;
    display: none;
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <div class="card-title">July Radio Admin</div>
    <div class="status-dot" id="statusDot"></div>
  </div>
  <div class="card-body">

    <div id="loginView" class="active">
      <div class="field">
        <label class="field-label">Password</label>
        <input type="password" id="passwordInput" placeholder="Enter admin password" onkeydown="if(event.key==='Enter')login()">
      </div>
      <div class="msg" id="loginMsg"></div>
      <button class="btn" onclick="login()">Enter</button>
    </div>

    <div id="adminView">
      <div class="current-mode">Current mode: <span id="currentModeLabel">—</span></div>
      <div class="msg" id="adminMsg"></div>

      <div class="mode-toggle">
        <button class="mode-btn" id="btnLastfm" onclick="selectMode('lastfm')">Last.fm</button>
        <button class="mode-btn" id="btnDjset" onclick="selectMode('djset')">DJ Set</button>
      </div>

      <div id="djFields">
        <div class="field">
          <label class="field-label">Mix Title</label>
          <input type="text" id="djTitle" placeholder="e.g. Burial — Untrue (Full Album)">
        </div>
        <div class="field">
          <label class="field-label">DJ / Host Name</label>
          <input type="text" id="djName" placeholder="e.g. C. / Guest DJ">
        </div>
        <div class="field">
          <label class="field-label">Set Image URL</label>
          <input type="url" id="djImage" placeholder="https://..." oninput="previewImage()">
          <img id="imgPreview" class="preview-img" alt="preview">
        </div>
      </div>

      <button class="btn" onclick="saveMode()">Apply</button>

      <div class="divider"></div>
      <button class="btn" onclick="logout()" style="border-color:#333;color:#555;">Log out</button>
    </div>

  </div>
</div>

<script>
const WORKER = 'https://julyimages.sxrsq1.workers.dev';
let password = '';
let selectedMode = 'lastfm';

async function login() {
  const pw = document.getElementById('passwordInput').value;
  if (!pw) return;

  // Test password by calling admin endpoint
  try {
    const res = await fetch(WORKER + '/admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw, mode: 'lastfm' })
    });
    const data = await res.json();
    if (data.ok) {
      password = pw;
      document.getElementById('loginView').classList.remove('active');
      document.getElementById('adminView').classList.add('active');
      loadCurrentMode();
    } else {
      showMsg('loginMsg', 'error', 'Wrong password');
    }
  } catch(e) {
    showMsg('loginMsg', 'error', 'Could not connect');
  }
}

async function loadCurrentMode() {
  try {
    const res = await fetch(WORKER + '/mode');
    const data = await res.json();
    selectedMode = data.mode || 'lastfm';
    updateModeUI();

    if (data.djset) {
      document.getElementById('djTitle').value = data.djset.title || '';
      document.getElementById('djName').value = data.djset.djName || '';
      document.getElementById('djImage').value = data.djset.image || '';
      previewImage();
    }

    const dot = document.getElementById('statusDot');
    dot.className = 'status-dot ' + (selectedMode === 'djset' ? 'dj' : 'live');
  } catch(e) {}
}

function selectMode(mode) {
  selectedMode = mode;
  updateModeUI();
}

function updateModeUI() {
  document.getElementById('btnLastfm').className = 'mode-btn' + (selectedMode === 'lastfm' ? ' active' : '');
  document.getElementById('btnDjset').className = 'mode-btn' + (selectedMode === 'djset' ? ' active' : '');
  document.getElementById('djFields').className = selectedMode === 'djset' ? 'visible' : '';
  document.getElementById('currentModeLabel').textContent = selectedMode === 'lastfm' ? 'Last.fm' : 'DJ Set';
}

async function saveMode() {
  const body = { password, mode: selectedMode };

  if (selectedMode === 'djset') {
    body.djset = {
      title: document.getElementById('djTitle').value,
      djName: document.getElementById('djName').value,
      image: document.getElementById('djImage').value
    };
    if (!body.djset.title) {
      showMsg('adminMsg', 'error', 'Please enter a mix title');
      return;
    }
  }

  try {
    const res = await fetch(WORKER + '/admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (data.ok) {
      showMsg('adminMsg', 'success', 'Mode updated — goes live within 15 seconds');
      const dot = document.getElementById('statusDot');
      dot.className = 'status-dot ' + (selectedMode === 'djset' ? 'dj' : 'live');
    } else {
      showMsg('adminMsg', 'error', 'Failed to update');
    }
  } catch(e) {
    showMsg('adminMsg', 'error', 'Could not connect to server');
  }
}

function previewImage() {
  const url = document.getElementById('djImage').value;
  const img = document.getElementById('imgPreview');
  if (url) {
    img.src = url;
    img.style.display = 'block';
  } else {
    img.style.display = 'none';
  }
}

function logout() {
  password = '';
  document.getElementById('adminView').classList.remove('active');
  document.getElementById('loginView').classList.add('active');
  document.getElementById('passwordInput').value = '';
}

function showMsg(id, type, text) {
  const el = document.getElementById(id);
  el.className = 'msg ' + type;
  el.textContent = text;
  setTimeout(function() { el.className = 'msg'; }, 4000);
}
</script>
</body>
</html>
