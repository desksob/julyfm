<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>July Radio — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #c8a96e;
    --accent-dim: #c8a96e22;
    --accent-border: #c8a96e44;
  }

  body {
    background: #0a0a0a;
    color: #e0d9cc;
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    padding-bottom: 100px;
  }


  #adminBg {
    position: fixed;
    inset: -60px;
    background-size: cover;
    background-position: center;
    filter: blur(80px) saturate(0.25) brightness(0.12);
    transition: background-image 2s ease;
    z-index: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1s ease, background-image 2s ease;
  }

  #adminBg.visible { opacity: 1; }

  #profileSelect, #loginView, #dashView { position: relative; z-index: 1; }

  /* ===== VIEWS ===== */
  .view { display: none; }
  .view.active { display: block; }

  /* ===== PROFILE SELECT ===== */
  #profileSelect {
    min-height: 100vh;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }
  #profileSelect.active { display: flex; }

  .ps-logo { height: 44px; margin-bottom: 48px; }

  .ps-prompt {
    font-size: 10px;
    color: #333;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 48px;
  }

  .ps-cards {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .ps-card {
    width: 160px;
    cursor: pointer;
    text-align: center;
  }

  .ps-img {
    width: 160px;
    height: 210px;
    border-radius: 4px;
    overflow: hidden;
    border: 2px solid transparent;
    background: #111;
    transition: border-color 0.3s, box-shadow 0.3s;
    position: relative;
  }

  .ps-img img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: top;
    transition: transform 0.4s;
  }

  .ps-card:hover .ps-img img { transform: scale(1.04); }

  .ps-placeholder {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'DM Serif Display', serif;
    font-size: 44px; color: #2a2a2a; font-style: italic;
  }

  .ps-name {
    font-size: 12px; color: #666;
    letter-spacing: 0.1em; text-transform: uppercase;
    margin-top: 14px;
    transition: color 0.3s;
  }

  .ps-card:hover .ps-name { color: #e0d9cc; }

  /* ===== LOGIN ===== */
  #loginView {
    min-height: 100vh;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }
  #loginView.active { display: flex; }

  .login-card {
    width: 100%; max-width: 380px;
    border: 1px solid #1a1a1a;
    border-radius: 4px;
    overflow: hidden;
  }

  .login-header {
    padding: 20px 24px;
    border-bottom: 1px solid #1a1a1a;
    display: flex; align-items: center; gap: 12px;
  }

  .login-avatar {
    width: 36px; height: 36px;
    border-radius: 3px; overflow: hidden;
    border: 1px solid #1a1a1a; background: #111; flex-shrink: 0;
  }

  .login-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .login-avatar-placeholder {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'DM Serif Display', serif; font-size: 16px;
    color: #2a2a2a; font-style: italic;
  }

  .login-name { font-size: 13px; color: #e0d9cc; }
  .login-sub { font-size: 10px; color: #555; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px; }

  .login-body { padding: 24px; }

  /* ===== DASHBOARD ===== */
  #dashView {
    display: none;
    min-height: 100vh;
  }
  #dashView.active { display: block; }

  .dash-header {
    padding: 24px 32px;
    border-bottom: 1px solid #1a1a1a;
    display: flex; align-items: center; justify-content: space-between;
  }

  .dash-logo { height: 36px; }

  .dash-host {
    display: flex; align-items: center; gap: 10px;
    font-size: 11px; color: #555;
    letter-spacing: 0.1em; text-transform: uppercase;
  }

  .dash-host-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
  }

  .dash-nav {
    display: flex; gap: 0;
    border-bottom: 1px solid #1a1a1a;
    padding: 0 32px;
    overflow-x: auto;
  }

  .dash-nav-item {
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: #555; padding: 14px 20px; cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s; white-space: nowrap;
  }

  .dash-nav-item.active { color: #e0d9cc; border-bottom-color: var(--accent); }
  .dash-nav-item:hover { color: #888; }

  .dash-content { padding: 32px; }

  .dash-panel { display: none; }
  .dash-panel.active { display: block; }

  /* ===== SHARED FORM STYLES ===== */
  .field { margin-bottom: 20px; }
  .field-label {
    font-size: 10px; color: #555; letter-spacing: 0.15em;
    text-transform: uppercase; margin-bottom: 8px; display: block;
  }

  input[type=text], input[type=password], input[type=url], input[type=time], textarea, select {
    width: 100%; background: #111; border: 1px solid #1a1a1a;
    border-radius: 2px; color: #e0d9cc;
    font-family: 'DM Mono', monospace; font-size: 13px;
    padding: 10px 14px; outline: none; transition: border-color 0.2s;
  }

  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 80px; }

  .btn {
    background: transparent; border: 1px solid var(--accent);
    color: var(--accent); font-family: 'DM Mono', monospace;
    font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
    padding: 10px 20px; border-radius: 2px; cursor: pointer;
    transition: all 0.2s;
  }

  .btn:hover { background: var(--accent); color: #0a0a0a; }
  .btn.full { width: 100%; }
  .btn.secondary { border-color: #2a2a2a; color: #555; }
  .btn.secondary:hover { background: #2a2a2a; color: #e0d9cc; }
  .btn.danger { border-color: #ff3a3a44; color: #ff3a3a; }
  .btn.danger:hover { background: #ff3a3a; color: #fff; }
  .btn.small { font-size: 10px; padding: 6px 12px; }

  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

  .msg {
    font-size: 11px; padding: 10px 14px; border-radius: 2px;
    margin-bottom: 16px; display: none;
  }
  .msg.success { background: #0a1a0a; border: 1px solid #1a3a1a; color: #4a8a4a; display: block; }
  .msg.error { background: #1a0a0a; border: 1px solid #3a1a1a; color: #8a4a4a; display: block; }

  .divider { height: 1px; background: #1a1a1a; margin: 24px 0; }

  /* ===== MODE TOGGLE ===== */
  .mode-toggle {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 1px; background: #1a1a1a; border-radius: 2px;
    overflow: hidden; margin-bottom: 24px;
  }

  .mode-btn {
    background: #0a0a0a; border: none; color: #555;
    font-family: 'DM Mono', monospace; font-size: 11px;
    letter-spacing: 0.12em; text-transform: uppercase;
    padding: 12px; cursor: pointer; transition: all 0.2s;
  }

  .mode-btn.active { background: #111; color: #e0d9cc; }

  /* ===== SCHEDULE ===== */
  .schedule-list { margin-bottom: 20px; }

  .schedule-item {
    display: grid; grid-template-columns: 80px 80px 1fr auto;
    gap: 8px; align-items: center;
    padding: 12px 0; border-bottom: 1px solid #111;
  }

  .schedule-item input[type=time] { padding: 6px 10px; font-size: 12px; }

  .day-select { padding: 6px 10px; font-size: 12px; }

  .show-name-input { padding: 6px 10px; font-size: 12px; }

  /* ===== PROFILE IMG PREVIEW ===== */
  .preview-img {
    width: 100%; max-height: 200px;
    object-fit: cover; object-position: top;
    border-radius: 2px; border: 1px solid #1a1a1a;
    margin-top: 8px; display: none;
  }

  /* ===== NOW PLAYING BAR ===== */
  #nowPlayingBar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(10,10,10,0.95);
    border-top: 1px solid #1a1a1a;
    padding: 12px 32px;
    display: flex; align-items: center; gap: 20px;
    transform: translateY(0);
    transition: transform 0.4s ease;
    z-index: 100;
    backdrop-filter: blur(8px);
  }

  #nowPlayingBar.hidden { transform: translateY(100%); }

  .np-art-mini {
    width: 44px; height: 44px;
    border-radius: 2px; border: 1px solid #1a1a1a;
    background: #111; flex-shrink: 0; overflow: hidden;
  }

  .np-art-mini img { width: 100%; height: 100%; object-fit: cover; display: none; }

  .np-info { flex: 1; min-width: 0; }
  .np-title-mini {
    font-size: 12px; color: #e0d9cc;
    text-transform: uppercase; letter-spacing: 0.05em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .np-artist-mini { font-size: 11px; color: var(--accent); margin-top: 2px; text-transform: uppercase; }

  .np-prev {
    display: flex; gap: 16px; align-items: center;
    border-left: 1px solid #1a1a1a; padding-left: 20px;
    max-width: 400px; overflow: hidden;
  }

  .np-prev-item { font-size: 10px; color: #333; white-space: nowrap; letter-spacing: 0.05em; text-transform: uppercase; }
  .np-prev-item span { color: #555; }

  .np-controls { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }

  .np-play-btn {
    width: 36px; height: 36px;
    border: 1px solid var(--accent); border-radius: 50%;
    background: transparent; color: var(--accent);
    font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; flex-shrink: 0;
  }

  .np-play-btn:hover { background: var(--accent); color: #0a0a0a; }

  .np-close-btn {
    background: none; border: none; color: #333;
    font-size: 16px; cursor: pointer; padding: 4px;
    transition: color 0.2s; flex-shrink: 0;
  }

  .np-close-btn:hover { color: #888; }

  .np-label {
    font-size: 9px; color: #333; letter-spacing: 0.15em;
    text-transform: uppercase; flex-shrink: 0;
  }

  .section-title {
    font-size: 10px; color: #555; letter-spacing: 0.2em;
    text-transform: uppercase; margin-bottom: 20px;
    padding-bottom: 12px; border-bottom: 1px solid #1a1a1a;
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }

  /* Mobile */
  @media (max-width: 600px) {
    .ps-cards { gap: 16px; }
    .ps-card { width: 120px; }
    .ps-img { width: 120px; height: 160px; }

    .login-card { max-width: 100%; }

    .dash-header { padding: 16px 20px; }
    .dash-logo { height: 28px; }
    .dash-nav { padding: 0 20px; gap: 0; }
    .dash-nav-item { padding: 12px 14px; font-size: 9px; }
    .dash-content { padding: 20px; }

    .grid-2 { grid-template-columns: 1fr; }

    .schedule-item { grid-template-columns: 70px 70px 1fr auto; gap: 6px; }

    #nowPlayingBar { padding: 10px 16px; gap: 12px; flex-wrap: wrap; }
    .np-prev { display: none; }
    .np-info { min-width: 0; flex: 1; }
    .np-title-mini { font-size: 11px; }
    .np-artist-mini { font-size: 10px; }
    .np-art-mini { width: 36px; height: 36px; }
    .np-controls { gap: 8px; }
    .np-label { display: none; }

    .dash-host { gap: 6px; font-size: 10px; }
    .dash-host-dot { display: none; }

    .btn-row { flex-direction: column; }
    .btn-row .btn { width: 100%; }
  }

</style>
</head>
<body>

<div id="adminBg"></div>

<!-- ===== PROFILE SELECT ===== -->
<div id="profileSelect" class="active">
  <img src="july-logo.png" alt="July Radio" class="ps-logo">
  <div class="ps-prompt">Welcome — choose your profile</div>
  <div class="ps-cards">

    <div class="ps-card" onclick="selectHost('c')">
      <div class="ps-img" id="ps-wrap-c">
        <img src="julyhost1.png" alt="C." id="ps-img-c" crossorigin="anonymous">
      </div>
      <div class="ps-name">C.</div>
    </div>

    <div class="ps-card" onclick="selectHost('fziwe')">
      <div class="ps-img" id="ps-wrap-fziwe" style="--h-accent:#6e8ac8;">
        <div class="ps-placeholder">F</div>
      </div>
      <div class="ps-name">Fziwe</div>
    </div>

    <div class="ps-card" onclick="selectHost('fiscia')">
      <div class="ps-img" id="ps-wrap-fiscia" style="--h-accent:#c86e8a;">
        <div class="ps-placeholder">Fi</div>
      </div>
      <div class="ps-name">Fiscia</div>
    </div>

  </div>
</div>

<!-- ===== LOGIN ===== -->
<div id="loginView">
  <div class="login-card">
    <div class="login-header">
      <div class="login-avatar" id="loginAvatar"></div>
      <div>
        <div class="login-name" id="loginName">—</div>
        <div class="login-sub">July Radio Admin</div>
      </div>
    </div>
    <div class="login-body">
      <div class="field">
        <label class="field-label">Password</label>
        <input type="password" id="passwordInput" placeholder="Enter your password" onkeydown="if(event.key==='Enter')login()">
      </div>
      <div class="msg" id="loginMsg"></div>
      <div class="btn-row">
        <button class="btn full" onclick="login()">Enter</button>
        <button class="btn secondary" onclick="backToProfiles()">Back</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== DASHBOARD ===== -->
<div id="dashView">
  <div class="dash-header">
    <img src="july-logo.png" alt="July Radio" class="dash-logo">
    <div class="dash-host">
      <div class="dash-host-dot"></div>
      <span id="dashHostName">—</span>
      <button class="btn secondary small" onclick="logout()" style="margin-left:8px;">Log out</button>
    </div>
  </div>

  <div class="dash-nav">
    <div class="dash-nav-item active" onclick="showPanel('broadcast',this)">Broadcast</div>
    <div class="dash-nav-item" onclick="showPanel('schedule',this)">Schedule</div>
    <div class="dash-nav-item" onclick="showPanel('profile',this)">Profile</div>
  </div>

  <div class="dash-content">

    <!-- BROADCAST -->
    <div class="dash-panel active" id="panel-broadcast">
      <div class="section-title">Broadcast Mode</div>
      <div class="msg" id="broadcastMsg"></div>

      <div class="mode-toggle">
        <button class="mode-btn active" id="btnLastfm" onclick="selectMode('lastfm')">Last.fm</button>
        <button class="mode-btn" id="btnDjset" onclick="selectMode('djset')">DJ Set</button>
      </div>

      <div id="djFields" style="display:none;">
        <div class="grid-2">
          <div class="field">
            <label class="field-label">Mix Title</label>
            <input type="text" id="djTitle" placeholder="e.g. Burial — Untrue">
          </div>
          <div class="field">
            <label class="field-label">Your Name</label>
            <input type="text" id="djName" placeholder="e.g. C.">
          </div>
        </div>
        <div class="field">
          <label class="field-label">Set Image URL</label>
          <input type="url" id="djImage" placeholder="https://..." oninput="previewDjImg()">
          <img id="djImgPreview" class="preview-img" alt="preview">
        </div>
      </div>

      <button class="btn" onclick="saveBroadcast()">Apply</button>
    </div>

    <!-- SCHEDULE -->
    <div class="dash-panel" id="panel-schedule">
      <div class="section-title">Your Shows</div>
      <div class="msg" id="scheduleMsg"></div>
      <div class="schedule-list" id="scheduleList"></div>
      <button class="btn secondary" onclick="addShowSlot()">+ Add Show</button>
      <div class="divider"></div>
      <button class="btn" onclick="saveSchedule()">Save Schedule</button>
    </div>

    <!-- PROFILE -->
    <div class="dash-panel" id="panel-profile">
      <div class="section-title">Your Profile</div>
      <div class="msg" id="profileMsg"></div>
      <div class="grid-2">
        <div class="field">
          <label class="field-label">Display Name</label>
          <input type="text" id="profileName" placeholder="e.g. C.">
        </div>
        <div class="field">
          <label class="field-label">Show Name(s)</label>
          <input type="text" id="profileShows" placeholder="e.g. Open Air · Playlist">
        </div>
      </div>
      <div class="field">
        <label class="field-label">Tagline</label>
        <input type="text" id="profileTagline" placeholder="e.g. taste over everything.">
      </div>
      <div class="field">
        <label class="field-label">Bio</label>
        <textarea id="profileBio" placeholder="A short bio about you and your show..."></textarea>
      </div>
      <div class="field">
        <label class="field-label">Photo URL</label>
        <input type="url" id="profilePhoto" placeholder="https://..." oninput="previewProfileImg()">
        <img id="profileImgPreview" class="preview-img" alt="preview">
      </div>
      <div class="field">
        <label class="field-label">Instagram</label>
        <input type="text" id="profileInstagram" placeholder="@handle">
      </div>
      <div class="field">
        <label class="field-label">SoundCloud</label>
        <input type="text" id="profileSoundcloud" placeholder="soundcloud.com/yourname">
      </div>
      <button class="btn" onclick="saveProfile()">Save Profile</button>
    </div>

  </div>
</div>

<!-- ===== NOW PLAYING BAR ===== -->
<div id="nowPlayingBar" class="hidden">
  <div class="np-art-mini" id="npArtMini">
    <img id="npImgMini" src="" alt="">
  </div>
  <div class="np-info">
    <div class="np-title-mini" id="npTitleMini">—</div>
    <div class="np-artist-mini" id="npArtistMini">—</div>
  </div>
  <div class="np-prev" id="npPrev"></div>
  <div class="np-controls">
    <span class="np-label">Monitor</span>
    <button class="np-play-btn" id="npPlayBtn" onclick="toggleMonitor()">&#9654;</button>
    <button class="np-close-btn" onclick="closeNowPlaying()" title="Close">✕</button>
  </div>
</div>

<script>
const WORKER = 'https://julyimages.sxrsq1.workers.dev';
const LASTFM_KEY = '1a71ac0b1d0df8175df73ee9ac362919';
const LASTFM_USER = 'injeton';

const HOSTS = {
  c:      { name: 'C.',     accent: '#c8a96e', password: 'julyat2025', photo: 'julyhost1.png' },
  fziwe:  { name: 'Fziwe',  accent: '#6e8ac8', password: 'fziwe2025',  photo: null },
  fiscia: { name: 'Fiscia', accent: '#c86e8a', password: 'fiscia2025', photo: null },
};

const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

let currentHost = null;
let selectedMode = 'lastfm';
let monitorAudio = null;
let monitorPlaying = false;
let lastTrack = '';
let scheduleSlots = [];

// ===== PROFILE SELECT =====
function setupHovers() {
  Object.keys(HOSTS).forEach(function(id) {
    const wrap = document.getElementById('ps-wrap-' + id);
    const host = HOSTS[id];
    if (!wrap) return;
    wrap.addEventListener('mouseenter', function() {
      wrap.style.borderColor = host.accent;
      wrap.style.boxShadow = '0 0 28px ' + host.accent + '44';
    });
    wrap.addEventListener('mouseleave', function() {
      wrap.style.borderColor = 'transparent';
      wrap.style.boxShadow = 'none';
    });
  });
}

function selectHost(id) {
  currentHost = id;
  const host = HOSTS[id];

  // Set accent color
  document.documentElement.style.setProperty('--accent', host.accent);
  document.documentElement.style.setProperty('--accent-dim', host.accent + '22');
  document.documentElement.style.setProperty('--accent-border', host.accent + '44');

  // Set login card
  const avatar = document.getElementById('loginAvatar');
  if (host.photo) {
    avatar.innerHTML = '<img src="' + host.photo + '" alt="' + host.name + '">';
  } else {
    avatar.innerHTML = '<div class="login-avatar-placeholder">' + host.name[0] + '</div>';
  }
  document.getElementById('loginName').textContent = host.name;

  document.getElementById('profileSelect').classList.remove('active');
  document.getElementById('loginView').classList.add('active');
  setTimeout(function() { document.getElementById('passwordInput').focus(); }, 100);
}

function backToProfiles() {
  document.getElementById('loginView').classList.remove('active');
  document.getElementById('passwordInput').value = '';
  document.getElementById('profileSelect').classList.add('active');
}

// ===== LOGIN =====
async function login() {
  const pw = document.getElementById('passwordInput').value;
  const host = HOSTS[currentHost];
  if (pw !== host.password) {
    showMsg('loginMsg', 'error', 'Wrong password');
    return;
  }

  document.getElementById('loginView').classList.remove('active');
  document.getElementById('dashView').classList.add('active');
  document.getElementById('dashHostName').textContent = host.name;

  await loadDashboard();
  document.getElementById('nowPlayingBar').classList.remove('hidden');
  startNowPlayingPoll();
}

function logout() {
  document.getElementById('dashView').classList.remove('active');
  document.getElementById('profileSelect').classList.add('active');
  document.getElementById('passwordInput').value = '';
  document.getElementById('nowPlayingBar').classList.add('hidden');
  stopMonitor();
}

// ===== DASHBOARD =====
function showPanel(id, el) {
  document.querySelectorAll('.dash-panel').forEach(function(p) { p.classList.remove('active'); });
  document.querySelectorAll('.dash-nav-item').forEach(function(n) { n.classList.remove('active'); });
  document.getElementById('panel-' + id).classList.add('active');
  el.classList.add('active');
}

async function loadDashboard() {
  await loadBroadcastMode();
  await loadSchedule();
  await loadProfile();
}

// ===== BROADCAST =====
async function loadBroadcastMode() {
  try {
    const res = await fetch(WORKER + '/mode');
    const data = await res.json();
    selectedMode = data.mode || 'lastfm';
    updateModeUI();
    if (data.djset) {
      document.getElementById('djTitle').value = data.djset.title || '';
      document.getElementById('djName').value = data.djset.djName || '';
      document.getElementById('djImage').value = data.djset.image || '';
      previewDjImg();
    }
  } catch(e) {}
}

function selectMode(mode) {
  selectedMode = mode;
  updateModeUI();
}

function updateModeUI() {
  document.getElementById('btnLastfm').className = 'mode-btn' + (selectedMode === 'lastfm' ? ' active' : '');
  document.getElementById('btnDjset').className = 'mode-btn' + (selectedMode === 'djset' ? ' active' : '');
  document.getElementById('djFields').style.display = selectedMode === 'djset' ? 'block' : 'none';
}

async function saveBroadcast() {
  const body = {
    password: HOSTS[currentHost].password,
    mode: selectedMode
  };
  if (selectedMode === 'djset') {
    const title = document.getElementById('djTitle').value;
    if (!title) { showMsg('broadcastMsg', 'error', 'Please enter a mix title'); return; }
    body.djset = {
      title: title,
      djName: document.getElementById('djName').value || HOSTS[currentHost].name,
      image: document.getElementById('djImage').value
    };
  }
  try {
    const res = await fetch(WORKER + '/admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (data.ok) showMsg('broadcastMsg', 'success', 'Mode updated — live within 15 seconds');
    else showMsg('broadcastMsg', 'error', 'Failed to update');
  } catch(e) { showMsg('broadcastMsg', 'error', 'Connection error'); }
}

function previewDjImg() {
  const url = document.getElementById('djImage').value;
  const img = document.getElementById('djImgPreview');
  img.src = url; img.style.display = url ? 'block' : 'none';
}

// ===== SCHEDULE =====
async function loadSchedule() {
  try {
    const res = await fetch(WORKER + '/schedule?host=' + currentHost);
    const data = await res.json();
    scheduleSlots = data.slots || [];
  } catch(e) { scheduleSlots = []; }
  renderSchedule();
}

function renderSchedule() {
  const list = document.getElementById('scheduleList');
  list.innerHTML = '';
  scheduleSlots.forEach(function(slot, i) {
    const row = document.createElement('div');
    row.className = 'schedule-item';
    row.innerHTML =
      '<select class="day-select" onchange="scheduleSlots[' + i + '].day=parseInt(this.value)">' +
        DAYS.map(function(d,j) { return '<option value="' + j + '"' + (slot.day===j?' selected':'') + '>' + d.slice(0,3) + '</option>'; }).join('') +
      '</select>' +
      '<input type="time" value="' + (slot.start||'00:00') + '" onchange="scheduleSlots[' + i + '].start=this.value">' +
      '<input type="text" class="show-name-input" value="' + (slot.name||'') + '" placeholder="Show name" onchange="scheduleSlots[' + i + '].name=this.value">' +
      '<button class="btn danger small" onclick="removeSlot(' + i + ')">✕</button>';
    list.appendChild(row);
  });
}

function addShowSlot() {
  scheduleSlots.push({ day: 1, start: '18:00', name: '' });
  renderSchedule();
}

function removeSlot(i) {
  scheduleSlots.splice(i, 1);
  renderSchedule();
}

async function saveSchedule() {
  try {
    const res = await fetch(WORKER + '/schedule', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: HOSTS[currentHost].password, host: currentHost, slots: scheduleSlots })
    });
    const data = await res.json();
    if (data.ok) showMsg('scheduleMsg', 'success', 'Schedule saved');
    else showMsg('scheduleMsg', 'error', 'Failed to save');
  } catch(e) { showMsg('scheduleMsg', 'error', 'Connection error'); }
}

// ===== PROFILE =====
async function loadProfile() {
  try {
    const res = await fetch(WORKER + '/profile?host=' + currentHost);
    const data = await res.json();
    if (data.profile) {
      const p = data.profile;
      document.getElementById('profileName').value = p.name || HOSTS[currentHost].name;
      document.getElementById('profileShows').value = p.shows || '';
      document.getElementById('profileTagline').value = p.tagline || '';
      document.getElementById('profileBio').value = p.bio || '';
      document.getElementById('profilePhoto').value = p.photo || '';
      document.getElementById('profileInstagram').value = p.instagram || '';
      document.getElementById('profileSoundcloud').value = p.soundcloud || '';
      previewProfileImg();
    }
  } catch(e) {}
}

async function saveProfile() {
  const profile = {
    name: document.getElementById('profileName').value,
    shows: document.getElementById('profileShows').value,
    tagline: document.getElementById('profileTagline').value,
    bio: document.getElementById('profileBio').value,
    photo: document.getElementById('profilePhoto').value,
    instagram: document.getElementById('profileInstagram').value,
    soundcloud: document.getElementById('profileSoundcloud').value,
  };
  try {
    const res = await fetch(WORKER + '/profile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: HOSTS[currentHost].password, host: currentHost, profile })
    });
    const data = await res.json();
    if (data.ok) showMsg('profileMsg', 'success', 'Profile saved');
    else showMsg('profileMsg', 'error', 'Failed to save');
  } catch(e) { showMsg('profileMsg', 'error', 'Connection error'); }
}

function previewProfileImg() {
  const url = document.getElementById('profilePhoto').value;
  const img = document.getElementById('profileImgPreview');
  img.src = url; img.style.display = url ? 'block' : 'none';
}

// ===== NOW PLAYING BAR =====

function updateAdminBg(imgUrl) {
  const bg = document.getElementById('adminBg');
  if (imgUrl) {
    bg.style.backgroundImage = 'url(' + imgUrl + ')';
    bg.classList.add('visible');
  }
}

function startNowPlayingPoll() {
  fetchNowPlaying();
  setInterval(fetchNowPlaying, 15000);
}

async function fetchNowPlaying() {
  try {
    const url = 'https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=' + LASTFM_USER + '&api_key=' + LASTFM_KEY + '&format=json&limit=5';
    const res = await fetch(url);
    const data = await res.json();
    const tracks = data.recenttracks.track;
    if (!tracks || !tracks.length) return;

    const current = Array.isArray(tracks) ? tracks[0] : tracks;
    const trackName = current.name;
    const artistName = current.artist['#text'];
    const trackKey = trackName + artistName;

    if (trackKey !== lastTrack) {
      lastTrack = trackKey;
      document.getElementById('npTitleMini').textContent = trackName;
      document.getElementById('npArtistMini').textContent = artistName;

      const images = current.image || [];
      const art = images.find(function(i) { return i.size === 'extralarge'; });
      const img = document.getElementById('npImgMini');
      if (art && art['#text']) { img.src = art['#text']; img.style.display = 'block'; updateAdminBg(art['#text']); }
    }

    // Previous tracks
    const history = Array.isArray(tracks) ? tracks.slice(1, 4) : [];
    const prev = document.getElementById('npPrev');
    prev.innerHTML = history.map(function(t) {
      return '<div class="np-prev-item"><span>' + t.artist['#text'] + '</span> — ' + t.name + '</div>';
    }).join('');

  } catch(e) {}
}

function toggleMonitor() {
  const streamUrl = 'https://s48.myradiostream.com:14791/listen.mp3';
  if (!monitorPlaying) {
    monitorAudio = new Audio(streamUrl);
    monitorAudio.volume = 0.7;
    monitorAudio.play().then(function() {
      monitorPlaying = true;
      document.getElementById('npPlayBtn').innerHTML = '&#9646;&#9646;';
    }).catch(function() {});
  } else {
    monitorAudio.pause();
    monitorAudio = null;
    monitorPlaying = false;
    document.getElementById('npPlayBtn').innerHTML = '&#9654;';
  }
}

function stopMonitor() {
  if (monitorAudio) { monitorAudio.pause(); monitorAudio = null; }
  monitorPlaying = false;
}

function closeNowPlaying() {
  document.getElementById('nowPlayingBar').classList.add('hidden');
  stopMonitor();
}

// ===== UTILS =====
function showMsg(id, type, text) {
  const el = document.getElementById(id);
  el.className = 'msg ' + type;
  el.textContent = text;
  setTimeout(function() { el.className = 'msg'; }, 4000);
}

setupHovers();
</script>
