<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>July Radio — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --accent: #c8a96e; }
  body { background: #0a0a0a; color: #e0d9cc; font-family: 'DM Mono', monospace; min-height: 100vh; padding-bottom: 100px; }

  #adminBg { position: fixed; inset: -60px; background-size: cover; background-position: center; filter: blur(80px) saturate(0.25) brightness(0.12); transition: opacity 1s ease, background-image 2s ease; z-index: 0; pointer-events: none; opacity: 0; }
  #adminBg.visible { opacity: 1; }
  #profileSelect, #loginView, #dashView { position: relative; z-index: 1; }

  /* PROFILE SELECT */
  #profileSelect { min-height: 100vh; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; }
  #profileSelect.active { display: flex; }
  .ps-logo { height: 44px; margin-bottom: 48px; }
  .ps-prompt { font-size: 10px; color: #333; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 48px; }
  .ps-cards { display: flex; gap: 28px; flex-wrap: wrap; justify-content: center; }
  .ps-card { width: 160px; cursor: pointer; text-align: center; }
  .ps-img { width: 160px; height: 210px; border-radius: 4px; overflow: hidden; border: 2px solid transparent; background: #111; transition: border-color 0.3s, box-shadow 0.3s; position: relative; }
  .ps-img img { width: 100%; height: 100%; object-fit: cover; object-position: top; transition: transform 0.4s; }
  .ps-card:hover .ps-img img { transform: scale(1.04); }
  .ps-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-family: 'DM Serif Display', serif; font-size: 44px; color: #2a2a2a; font-style: italic; }
  .ps-name { font-size: 12px; color: #666; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 14px; transition: color 0.3s; }
  .ps-card:hover .ps-name { color: #e0d9cc; }

  /* LOGIN */
  #loginView { min-height: 100vh; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; }
  #loginView.active { display: flex; }
  .login-card { width: 100%; max-width: 380px; border: 1px solid #1a1a1a; border-radius: 4px; overflow: hidden; }
  .login-header { padding: 20px 24px; border-bottom: 1px solid #1a1a1a; display: flex; align-items: center; gap: 12px; }
  .login-avatar { width: 36px; height: 36px; border-radius: 3px; overflow: hidden; border: 1px solid #1a1a1a; background: #111; flex-shrink: 0; }
  .login-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .login-avatar-ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-family: 'DM Serif Display', serif; font-size: 16px; color: #2a2a2a; font-style: italic; }
  .login-name { font-size: 13px; color: #e0d9cc; }
  .login-sub { font-size: 10px; color: #555; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px; }
  .login-body { padding: 24px; }

  /* DASHBOARD */
  #dashView { display: none; min-height: 100vh; }
  #dashView.active { display: block; }
  .dash-header { padding: 24px 32px; border-bottom: 1px solid #1a1a1a; display: flex; align-items: center; justify-content: space-between; }
  .dash-logo { height: 36px; }
  .dash-host { display: flex; align-items: center; gap: 10px; font-size: 11px; color: #555; letter-spacing: 0.1em; text-transform: uppercase; }
  .dash-host-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .dash-nav { display: flex; border-bottom: 1px solid #1a1a1a; padding: 0 32px; overflow-x: auto; }
  .dash-nav-item { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #555; padding: 14px 20px; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
  .dash-nav-item.active { color: #e0d9cc; border-bottom-color: var(--accent); }
  .dash-nav-item:hover { color: #888; }
  .dash-content { padding: 32px; }
  .dash-panel { display: none; }
  .dash-panel.active { display: block; }

  /* FORMS */
  .field { margin-bottom: 20px; }
  .field-label { font-size: 10px; color: #555; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 8px; display: block; }
  input[type=text], input[type=password], input[type=url], input[type=time], input[type=file], textarea, select { width: 100%; background: #111; border: 1px solid #1a1a1a; border-radius: 2px; color: #e0d9cc; font-family: 'DM Mono', monospace; font-size: 13px; padding: 10px 14px; outline: none; transition: border-color 0.2s; }
  input[type=time] { color-scheme: dark; color: #e0d9cc !important; }
  input[type=time]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.6; cursor: pointer; }
  input[type=time]::-webkit-datetime-edit { color: #e0d9cc; }
  input[type=time]::-webkit-datetime-edit-hour-field, input[type=time]::-webkit-datetime-edit-minute-field, input[type=time]::-webkit-datetime-edit-ampm-field { color: #e0d9cc; background: transparent; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 80px; }
  .btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; padding: 10px 20px; border-radius: 2px; cursor: pointer; transition: all 0.2s; }
  .btn:hover { background: var(--accent); color: #0a0a0a; }
  .btn.full { width: 100%; }
  .btn.secondary { border-color: #2a2a2a; color: #555; }
  .btn.secondary:hover { background: #2a2a2a; color: #e0d9cc; }
  .btn.danger { border-color: #ff3a3a44; color: #ff3a3a; }
  .btn.danger:hover { background: #ff3a3a; color: #fff; }
  .btn.small { font-size: 10px; padding: 6px 12px; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .msg { font-size: 11px; padding: 10px 14px; border-radius: 2px; margin-bottom: 16px; display: none; }
  .msg.success { background: #0a1a0a; border: 1px solid #1a3a1a; color: #4a8a4a; display: block; }
  .msg.error { background: #1a0a0a; border: 1px solid #3a1a1a; color: #8a4a4a; display: block; }
  .divider { height: 1px; background: #1a1a1a; margin: 24px 0; }
  .section-title { font-size: 10px; color: #555; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #1a1a1a; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .preview-img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 2px; border: 1px solid #1a1a1a; margin-top: 8px; display: none; }

  /* MODE TOGGLE */
  .mode-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #1a1a1a; border-radius: 2px; overflow: hidden; margin-bottom: 24px; }
  .mode-btn { background: #0a0a0a; border: none; color: #555; font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; padding: 12px; cursor: pointer; transition: all 0.2s; }
  .mode-btn.active { background: #111; color: #e0d9cc; }

  /* SCHEDULE */
  .schedule-item { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 0; border-bottom: none; }
  .schedule-item select { width: auto; }
  .schedule-item input[type=text] { flex: 1; min-width: 120px; }
  .time-group { display: flex; gap: 4px; align-items: center; }
  .time-label { font-size: 9px; color: #555; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
  .schedule-slot-wrap { border-bottom: 1px solid #111; }

  /* NOW PLAYING BAR */
  #nowPlayingBar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10,10,10,0.95); border-top: 1px solid #1a1a1a; padding: 12px 32px; display: flex; align-items: center; gap: 16px; transform: translateY(0); transition: transform 0.4s ease; z-index: 100; backdrop-filter: blur(8px); }
  #nowPlayingBar.hidden { transform: translateY(100%); }
  .np-art-mini { width: 44px; height: 44px; border-radius: 2px; border: 1px solid #1a1a1a; background: #111; flex-shrink: 0; overflow: hidden; }
  .np-art-mini img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .np-info { flex: 1; min-width: 0; }
  .np-title-mini { font-size: 12px; color: #e0d9cc; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-artist-mini { font-size: 11px; color: var(--accent); margin-top: 2px; text-transform: uppercase; }
  .np-prev { display: flex; gap: 16px; align-items: center; border-left: 1px solid #1a1a1a; padding-left: 16px; max-width: 360px; overflow: hidden; }
  .np-prev-item { font-size: 10px; color: #333; white-space: nowrap; letter-spacing: 0.05em; text-transform: uppercase; }
  .np-prev-item span { color: #555; }
  .np-clocks { display: flex; flex-direction: column; gap: 2px; border-left: 1px solid #1a1a1a; padding-left: 16px; flex-shrink: 0; }
  .np-clock-row { font-size: 10px; color: #333; letter-spacing: 0.1em; }
  .np-clock-row b { color: #555; }
  .np-controls { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .np-play-btn { width: 36px; height: 36px; border: 1px solid var(--accent); border-radius: 50%; background: transparent; color: var(--accent); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .np-play-btn:hover { background: var(--accent); color: #0a0a0a; }
  .np-close-btn { background: none; border: none; color: #333; font-size: 16px; cursor: pointer; padding: 4px; transition: color 0.2s; }
  .np-close-btn:hover { color: #888; }

  /* NOTIFICATION BAR */
  .notif-bar { position: fixed; top: 0; left: 0; right: 0; background: #ff3a3a; color: #fff; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; padding: 10px 32px; display: flex; align-items: center; justify-content: space-between; z-index: 200; transform: translateY(-100%); transition: transform 0.4s ease; }
  .notif-bar.visible { transform: translateY(0); }
  .notif-close { background: none; border: none; color: #fff; cursor: pointer; font-size: 16px; }

  /* TICKER */
  #tickerList input[type=text] { color: #e0d9cc; background: #111; }
  
  /* MOBILE */
  @media (max-width: 600px) {
    .ps-cards { gap: 16px; }
    .ps-card { width: 120px; }
    .ps-img { width: 120px; height: 160px; }
    .dash-header { padding: 16px 20px; }
    .dash-logo { height: 28px; }
    .dash-nav { padding: 0 16px; }
    .dash-nav-item { padding: 12px 12px; font-size: 9px; }
    .dash-content { padding: 20px; }
    .grid-2 { grid-template-columns: 1fr; }
    .schedule-item { flex-wrap: wrap; gap: 6px; }
    #nowPlayingBar { padding: 10px 16px; gap: 10px; }
    .np-prev, .np-clocks { display: none; }
    .btn-row { flex-direction: column; }
    .btn-row .btn { width: 100%; }
  }
</style>
</head>
<body>

<div class="notif-bar" id="notifBar"><span id="notifMsg">—</span><button class="notif-close" onclick="closeNotif()">✕</button></div>
<div id="adminBg"></div>

<!-- PROFILE SELECT -->
<div id="profileSelect" class="active">
  <img src="july-logo.png" alt="July Radio" class="ps-logo">
  <div class="ps-prompt">Welcome — choose your profile</div>
  <div class="ps-cards">
    <div class="ps-card" onclick="selectHost('c')">
      <div class="ps-img" id="ps-wrap-c"><img src="julyhost1.png" alt="C." id="ps-img-c" crossorigin="anonymous"></div>
      <div class="ps-name">C.</div>
    </div>
    <div class="ps-card" onclick="selectHost('fziwe')">
      <div class="ps-img" id="ps-wrap-fziwe"><img src="diogo.gif" alt="Fziwe" id="ps-img-fziwe" crossorigin="anonymous"></div>
      <div class="ps-name">Fziwe</div>
    </div>
    <div class="ps-card" onclick="selectHost('fiscia')">
      <div class="ps-img" id="ps-wrap-fiscia"><img src="fiscia.jpeg" alt="Fiscia" id="ps-img-fiscia" crossorigin="anonymous"></div>
      <div class="ps-name">Fiscia</div>
    </div>
  </div>
</div>

<!-- LOGIN -->
<div id="loginView">
  <div class="login-card">
    <div class="login-header">
      <div class="login-avatar" id="loginAvatar"></div>
      <div><div class="login-name" id="loginName">—</div><div class="login-sub">July Radio Admin</div></div>
    </div>
    <div class="login-body">
      <div class="field"><label class="field-label">Password</label><input type="password" id="passwordInput" placeholder="Enter your password" onkeydown="if(event.key==='Enter')login()"></div>
      <div class="msg" id="loginMsg"></div>
      <div class="btn-row">
        <button class="btn full" onclick="login()">Enter</button>
        <button class="btn secondary" onclick="backToProfiles()">Back</button>
      </div>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashView">
  <div class="dash-header">
    <img src="july-logo.png" alt="July Radio" class="dash-logo">
    <div class="dash-host">
      <div class="dash-host-dot"></div>
      <span id="dashHostName">—</span>
      <button class="btn secondary small" onclick="logout()" style="margin-left:8px;">Log out</button>
    </div>
  </div>

  <div class="dash-nav">
    <div class="dash-nav-item active" onclick="showPanel('broadcast',this)">Broadcast</div>
    <div class="dash-nav-item" onclick="showPanel('schedule',this)">Schedule</div>
    <div class="dash-nav-item" onclick="showPanel('profile',this)">Profile</div>
    <div class="dash-nav-item" onclick="showPanel('alerts',this)">Alerts</div>
    <div class="dash-nav-item" onclick="showPanel('ticker',this)">Ticker</div>
  </div>

  <div class="dash-content">

    <!-- BROADCAST -->
    <div class="dash-panel active" id="panel-broadcast">
      <div class="section-title">Broadcast Mode</div>
      <div class="msg" id="broadcastMsg"></div>
      <div class="mode-toggle">
        <button class="mode-btn active" id="btnLastfm" onclick="selectMode('lastfm')">Last.fm</button>
        <button class="mode-btn" id="btnDjset" onclick="selectMode('djset')">DJ Set</button>
      </div>
      <div id="djFields" style="display:none;">
        <div class="grid-2">
          <div class="field"><label class="field-label">Mix Title</label><input type="text" id="djTitle" placeholder="e.g. Burial — Untrue"></div>
          <div class="field"><label class="field-label">Your Name</label><input type="text" id="djName" placeholder="e.g. C."></div>
        </div>
        <div class="field">
          <label class="field-label">Set Image</label>
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">
            <input type="file" id="djImageFile" accept="image/*,.gif" style="font-size:11px;color:#555;flex:1;" onchange="uploadDjImage()">
            <span style="font-size:10px;color:#333;">or</span>
            <input type="url" id="djImage" placeholder="Paste image URL" oninput="previewDjImg()" style="flex:2;">
          </div>
          <img id="djImgPreview" class="preview-img" alt="preview">
          <div id="uploadStatus" style="font-size:11px;color:#555;margin-top:6px;display:none;"></div>
        </div>
      </div>
      <button class="btn" onclick="saveBroadcast()">Apply</button>
    </div>

    <!-- SCHEDULE -->
    <div class="dash-panel" id="panel-schedule">
      <div class="section-title">Your Shows</div>
      <div class="msg" id="scheduleMsg"></div>
      <div id="scheduleList"></div>
      <button class="btn secondary" onclick="addShowSlot()">+ Add Show</button>
      <div class="divider"></div>
      <button class="btn" onclick="saveSchedule()">Save Schedule</button>
    </div>

    <!-- PROFILE -->
    <div class="dash-panel" id="panel-profile">
      <div class="section-title">Your Profile</div>
      <div class="msg" id="profileMsg"></div>
      <div class="grid-2">
        <div class="field"><label class="field-label">Display Name</label><input type="text" id="profileName" placeholder="e.g. C."></div>
        <div class="field"><label class="field-label">Show Name(s)</label><input type="text" id="profileShows" placeholder="e.g. Open Air · Playlist"></div>
      </div>
      <div class="field"><label class="field-label">Tagline</label><input type="text" id="profileTagline" placeholder="e.g. taste over everything."></div>
      <div class="field"><label class="field-label">Bio</label><textarea id="profileBio" placeholder="A short bio..."></textarea></div>
      <div class="field"><label class="field-label">Photo URL</label><input type="url" id="profilePhoto" placeholder="https://... (PNG, JPG or GIF supported)" oninput="previewProfileImg()"><img id="profileImgPreview" class="preview-img" alt="preview"></div>
      <div class="grid-2">
        <div class="field"><label class="field-label">Instagram</label><input type="text" id="profileInstagram" placeholder="@handle"></div>
        <div class="field"><label class="field-label">SoundCloud</label><input type="text" id="profileSoundcloud" placeholder="soundcloud.com/yourname"></div>
      </div>
      <button class="btn" onclick="saveProfile()">Save Profile</button>
    </div>

    <!-- ALERTS -->
    <div class="dash-panel" id="panel-alerts">
      <div class="section-title">Send Alert to Listeners</div>
      <div class="msg" id="alertsMsg"></div>
      <div class="field">
        <label class="field-label">Alert Message</label>
        <input type="text" id="alertText" placeholder="e.g. Taking a 5 min break, back shortly..." maxlength="120">
        <div style="font-size:10px;color:#333;margin-top:6px;letter-spacing:0.08em;">Slides in on the website for 8 seconds. Max 120 characters.</div>
      </div>
      <div class="btn-row">
        <button class="btn" onclick="sendAlert()">Send Alert</button>
        <button class="btn secondary" onclick="clearAlert()">Clear Alert</button>
      </div>
    </div>

    <!-- TICKER -->
    <div class="dash-panel" id="panel-ticker">
      <div class="section-title">Ticker Messages</div>
      <div class="msg" id="tickerMsg"></div>
      <div id="tickerList"></div>
      <div class="btn-row" style="margin-top:12px;">
        <button class="btn secondary" onclick="addTickerMsg()">+ Add Message</button>
      </div>
      <div class="divider"></div>
      <button class="btn" onclick="saveTicker()">Save Ticker</button>
    </div>

  </div>

</div>

<!-- NOW PLAYING BAR -->
<div id="nowPlayingBar" class="hidden">
  <div class="np-art-mini"><img id="npImgMini" src="" alt=""></div>
  <div class="np-info">
    <div class="np-title-mini" id="npTitleMini">—</div>
    <div class="np-artist-mini" id="npArtistMini">—</div>
  </div>
  <div class="np-prev" id="npPrev"></div>
  <div class="np-clocks">
    <div class="np-clock-row"><b>EAT</b> <span id="npClockNairobi">—</span></div>
    <div class="np-clock-row"><b>BST</b> <span id="npClockLondon">—</span></div>
    <div class="np-clock-row"><b>EST</b> <span id="npClockNY">—</span></div>
  </div>
  <div class="np-controls">
    <button class="np-play-btn" id="npPlayBtn" onclick="toggleMonitor()">&#9654;</button>
    <button class="np-close-btn" onclick="closeNowPlaying()">✕</button>
  </div>
</div>

<script>
const WORKER = 'https://julyimages.sxrsq1.workers.dev';
const LASTFM_KEY = '1a71ac0b1d0df8175df73ee9ac362919';
const LASTFM_USER = 'injeton';
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

const HOSTS = {
  c:      { name: 'C.',     accent: '#c8a96e', password: 'julyat2025', photo: 'julyhost1.png' },
  fziwe:  { name: 'Fziwe',  accent: '#6e8ac8', password: 'fziwe2025',  photo: 'diogo.gif' },
  fiscia: { name: 'Fiscia', accent: '#c86e8a', password: 'fiscia2025', photo: 'fiscia.jpeg' },
};

let currentHost = null;
let selectedMode = 'lastfm';
let monitorAudio = null;
let monitorPlaying = false;
let lastTrack = '';
let lastNpTrack = '';
let silenceTimer = null;
let notifPermission = false;
let scheduleSlots = [];

// PROFILE SELECT
function setupHovers() {
  Object.keys(HOSTS).forEach(function(id) {
    var wrap = document.getElementById('ps-wrap-' + id);
    var host = HOSTS[id];
    if (!wrap) return;
    wrap.addEventListener('mouseenter', function() {
      wrap.style.borderColor = host.accent;
      wrap.style.boxShadow = '0 0 28px ' + host.accent + '44';
    });
    wrap.addEventListener('mouseleave', function() {
      wrap.style.borderColor = 'transparent';
      wrap.style.boxShadow = 'none';
    });
  });
}

function selectHost(id) {
  currentHost = id;
  var host = HOSTS[id];
  document.documentElement.style.setProperty('--accent', host.accent);

  var avatar = document.getElementById('loginAvatar');
  if (host.photo) {
    avatar.innerHTML = '<img src="' + host.photo + '" alt="' + host.name + '">';
  } else {
    avatar.innerHTML = '<div class="login-avatar-ph">' + host.name[0] + '</div>';
  }
  document.getElementById('loginName').textContent = host.name;
  document.getElementById('profileSelect').classList.remove('active');
  document.getElementById('loginView').classList.add('active');
  setTimeout(function() { document.getElementById('passwordInput').focus(); }, 100);
}

function backToProfiles() {
  document.getElementById('loginView').classList.remove('active');
  document.getElementById('passwordInput').value = '';
  document.getElementById('profileSelect').classList.add('active');
}

// LOGIN
async function login() {
  var pw = document.getElementById('passwordInput').value;
  var host = HOSTS[currentHost];
  if (pw !== host.password) { showMsg('loginMsg', 'error', 'Wrong password'); return; }
  document.getElementById('loginView').classList.remove('active');
  document.getElementById('dashView').classList.add('active');
  document.getElementById('dashHostName').textContent = host.name;
  await loadDashboard();
  document.getElementById('nowPlayingBar').classList.remove('hidden');
  startNowPlayingPoll();
  requestNotifPermission();
}

function logout() {
  document.getElementById('dashView').classList.remove('active');
  document.getElementById('profileSelect').classList.add('active');
  document.getElementById('passwordInput').value = '';
  document.getElementById('nowPlayingBar').classList.add('hidden');
  stopMonitor();
}

// DASHBOARD
function showPanel(id, el) {
  document.querySelectorAll('.dash-panel').forEach(function(p) { p.classList.remove('active'); });
  document.querySelectorAll('.dash-nav-item').forEach(function(n) { n.classList.remove('active'); });
  document.getElementById('panel-' + id).classList.add('active');
  el.classList.add('active');
}

async function loadDashboard() {
  await loadBroadcastMode();
  await loadSchedule();

// SCHEDULE
async function loadSchedule() {
  try {
    var res = await fetch(WORKER + '/schedule?host=' + currentHost);
    var data = await res.json();
    scheduleSlots = data.slots || [];
  } catch(e) { scheduleSlots = []; }
  renderSchedule();

function getAmPm(val) {
  return parseInt((val || '00:00').split(':')[0]) >= 12 ? 'PM' : 'AM';
}

function to24(h, m, ampm) {
  h = parseInt(h); m = parseInt(m);
  if (ampm === 'AM' && h === 12) h = 0;
  if (ampm === 'PM' && h !== 12) h += 12;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}

function updateSlotTime(i, field) {
  var hEl = document.getElementById('sh-' + field + '-h-' + i);
  var mEl = document.getElementById('sh-' + field + '-m-' + i);
  var aEl = document.getElementById('sh-' + field + '-a-' + i);
  if (hEl && mEl && aEl) {
    scheduleSlots[i][field] = to24(hEl.value, mEl.value, aEl.value);
  }
}

function makeSelect(id, options, selected, onchangeFn) {
  var sel = document.createElement('select');
  sel.id = id;
  sel.style.width = 'auto';
  options.forEach(function(opt) {
    var o = document.createElement('option');
    o.value = opt.value;
    o.textContent = opt.label;
    if (opt.value == selected) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener('change', onchangeFn);
  return sel;
}

function renderSchedule() {
  var list = document.getElementById('scheduleList');
  list.innerHTML = '';

  if (scheduleSlots.length === 0) {
    var empty = document.createElement('div');
    empty.style.cssText = 'font-size:11px;color:#444;padding:12px 0;letter-spacing:0.08em;';
    empty.textContent = 'No shows yet. Click + Add Show to start.';
    list.appendChild(empty);
    return;
  }

  scheduleSlots.forEach(function(slot, i) {
    var wrap = document.createElement('div');
    wrap.style.cssText = 'border:1px solid #1a1a1a;border-radius:3px;padding:14px;margin-bottom:10px;';

    var startH12 = parseInt((slot.start || '00:00').split(':')[0]) % 12 || 12;
    var startM = parseInt((slot.start || '00:00').split(':')[1]) || 0;
    var startAP = getAmPm(slot.start);
    var endH12 = parseInt((slot.end || '02:00').split(':')[0]) % 12 || 12;
    var endM = parseInt((slot.end || '02:00').split(':')[1]) || 0;
    var endAP = getAmPm(slot.end);

    var hourOpts = [];
    for (var h = 1; h <= 12; h++) hourOpts.push({ value: h, label: String(h).padStart(2,'0') });
    var minOpts = [0,15,30,45].map(function(m) { return { value: m, label: String(m).padStart(2,'0') }; });
    var apOpts = [{value:'AM',label:'AM'},{value:'PM',label:'PM'}];
    var dayOpts = DAYS.map(function(d,j) { return { value: j, label: d }; });

    // ROW 1: Day + times + name + buttons
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:8px;';

    // Day
    var dayWrap = document.createElement('div');
    var dayLbl = document.createElement('div');
    dayLbl.className = 'time-label';
    dayLbl.style.marginBottom = '4px';
    dayLbl.textContent = 'Day';
    var daySelect = makeSelect('sh-day-'+i, dayOpts, slot.day, function() {
      scheduleSlots[i].day = parseInt(this.value);
    });
    dayWrap.appendChild(dayLbl);
    dayWrap.appendChild(daySelect);
    row.appendChild(dayWrap);

    // Start time
    var startWrap = document.createElement('div');
    var startLbl = document.createElement('div');
    startLbl.className = 'time-label';
    startLbl.style.marginBottom = '4px';
    startLbl.textContent = 'Start';
    var startRow = document.createElement('div');
    startRow.style.cssText = 'display:flex;gap:4px;';
    startRow.appendChild(makeSelect('sh-start-h-'+i, hourOpts, startH12, function() { updateSlotTime(i,'start'); }));
    startRow.appendChild(makeSelect('sh-start-m-'+i, minOpts, startM, function() { updateSlotTime(i,'start'); }));
    startRow.appendChild(makeSelect('sh-start-a-'+i, apOpts, startAP, function() { updateSlotTime(i,'start'); }));
    startWrap.appendChild(startLbl);
    startWrap.appendChild(startRow);
    row.appendChild(startWrap);

    // End time
    var endWrap = document.createElement('div');
    var endLbl = document.createElement('div');
    endLbl.className = 'time-label';
    endLbl.style.marginBottom = '4px';
    endLbl.textContent = 'End';
    var endRow = document.createElement('div');
    endRow.style.cssText = 'display:flex;gap:4px;';
    endRow.appendChild(makeSelect('sh-end-h-'+i, hourOpts, endH12, function() { updateSlotTime(i,'end'); }));
    endRow.appendChild(makeSelect('sh-end-m-'+i, minOpts, endM, function() { updateSlotTime(i,'end'); }));
    endRow.appendChild(makeSelect('sh-end-a-'+i, apOpts, endAP, function() { updateSlotTime(i,'end'); }));
    endWrap.appendChild(endLbl);
    endWrap.appendChild(endRow);
    row.appendChild(endWrap);

    // Show name
    var nameWrap = document.createElement('div');
    nameWrap.style.cssText = 'flex:1;min-width:120px;';
    var nameLbl = document.createElement('div');
    nameLbl.className = 'time-label';
    nameLbl.style.marginBottom = '4px';
    nameLbl.textContent = 'Show Name';
    var nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.value = slot.name || '';
    nameInput.placeholder = 'Show name';
    nameInput.addEventListener('input', function() { scheduleSlots[i].name = this.value; });
    nameWrap.appendChild(nameLbl);
    nameWrap.appendChild(nameInput);
    row.appendChild(nameWrap);

    // Buttons
    var btnWrap = document.createElement('div');
    btnWrap.style.cssText = 'display:flex;flex-direction:column;gap:4px;';
    var descBtn = document.createElement('button');
    descBtn.className = 'btn secondary small';
    descBtn.textContent = '✎ desc';
    descBtn.addEventListener('click', function() { toggleDesc(i); });
    var removeBtn = document.createElement('button');
    removeBtn.className = 'btn danger small';
    removeBtn.textContent = '✕ remove';
    removeBtn.addEventListener('click', function() { removeSlot(i); });
    btnWrap.appendChild(descBtn);
    btnWrap.appendChild(removeBtn);
    row.appendChild(btnWrap);

    wrap.appendChild(row);

    // Description row
    var descRow = document.createElement('div');
    descRow.id = 'desc-row-' + i;
    descRow.style.display = slot.description ? 'block' : 'none';
    var descLbl = document.createElement('div');
    descLbl.className = 'time-label';
    descLbl.style.marginBottom = '4px';
    descLbl.textContent = 'Description';
    var descInput = document.createElement('input');
    descInput.type = 'text';
    descInput.value = slot.description || '';
    descInput.placeholder = 'e.g. tonight we go deep into 90s ambient';
    descInput.addEventListener('input', function() { scheduleSlots[i].description = this.value; });
    descRow.appendChild(descLbl);
    descRow.appendChild(descInput);
    wrap.appendChild(descRow);

    list.appendChild(wrap);
  });
}


function toggleDesc(i) {
  var el = document.getElementById('desc-row-' + i);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function addShowSlot() {
  scheduleSlots.push({ day: new Date().getDay(), start: '18:00', end: '20:00', name: '', description: '' });

function removeSlot(i) {

}

// NOW PLAYING BAR
function startNowPlayingPoll() {
  fetchNowPlaying();
  setInterval(fetchNowPlaying, 15000);

async function fetchNowPlaying() {
  try {
    var url = 'https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=' + LASTFM_USER + '&api_key=' + LASTFM_KEY + '&format=json&limit=5';
    var res = await fetch(url);
    var data = await res.json();
    var tracks = data.recenttracks.track;
    if (!tracks || !tracks.length) return;

    var current = Array.isArray(tracks) ? tracks[0] : tracks;
    var trackName = current.name;
    var artistName = current.artist['#text'];
    var trackKey = trackName + artistName;

    // Silence detection
    if (trackKey !== lastNpTrack) {
      lastNpTrack = trackKey;
      if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
      silenceTimer = setTimeout(function() {
        showNotif('No playback detected — Spotify may have paused');
      }, 10 * 60 * 1000);
    }

    if (trackKey !== lastTrack) {
      lastTrack = trackKey;
      document.getElementById('npTitleMini').textContent = trackName;
      document.getElementById('npArtistMini').textContent = artistName;
      var images = current.image || [];
      var art = images.find(function(i) { return i.size === 'extralarge'; });
      var img = document.getElementById('npImgMini');
      if (art && art['#text']) { img.src = art['#text']; img.style.display = 'block'; updateAdminBg(art['#text']); }
    }

    var history = Array.isArray(tracks) ? tracks.slice(1, 4) : [];
    var prev = document.getElementById('npPrev');
    prev.innerHTML = history.map(function(t) {
      return '<div class="np-prev-item"><span>' + t.artist['#text'] + '</span> — ' + t.name + '</div>';
    }).join('');
  } catch(e) {}
}

function toggleMonitor() {
  var streamUrl = 'https://s48.myradiostream.com:14791/listen.mp3';
  if (!monitorPlaying) {
    monitorAudio = new Audio(streamUrl);
    monitorAudio.volume = 0.7;
    monitorAudio.play().then(function() {
      monitorPlaying = true;
      document.getElementById('npPlayBtn').innerHTML = '&#9646;&#9646;';
    }).catch(function() {});
  } else {
    monitorAudio.pause(); monitorAudio = null; monitorPlaying = false;
    document.getElementById('npPlayBtn').innerHTML = '&#9654;';
  }
}

function stopMonitor() {
  if (monitorAudio) { monitorAudio.pause(); monitorAudio = null; }
  monitorPlaying = false;
}

function closeNowPlaying() {
  document.getElementById('nowPlayingBar').classList.add('hidden');
  stopMonitor();
}

// TICKER
var tickerMessages = [];

async function loadTicker() {
  try {
    var res = await fetch('https://julyimages.sxrsq1.workers.dev/ticker');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var data = await res.json();
    tickerMessages = Array.isArray(data.messages) && data.messages.length ? data.messages : [
      'Welcome to July Radio',
      'Live 24/7',
      'Full website coming soon at julyfm.com',
      'New music every morning on di:scovery',
      'Five artists a day on in:focus'
    ];
  } catch(e) {
    tickerMessages = [
      'Welcome to July Radio',
      'Live 24/7',
      'Full website coming soon'
    ];
  }
  renderTicker();
}

function renderTicker() {
  var list = document.getElementById('tickerList');
  list.innerHTML = '';
  tickerMessages.forEach(function(msg, i) {
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:8px;align-items:center;margin-bottom:8px;';
    var input = document.createElement('input');
    input.type = 'text';
    input.value = msg;
    input.style.flex = '1';
    input.dataset.index = String(i);
    input.addEventListener('input', function() {
      var idx = parseInt(this.dataset.index);
      tickerMessages[idx] = this.value;
    });
    var btn = document.createElement('button');
    btn.className = 'btn danger small';
    btn.textContent = '✕';
    (function(idx) {
      btn.addEventListener('click', function() { removeTicker(idx); });
    })(i);
    row.appendChild(input);
    row.appendChild(btn);
    list.appendChild(row);
  });
}

function addTickerMsg() {
  if (tickerMessages.length >= 8) { showMsg('tickerMsg', 'error', 'Max 8 messages'); return; }
  tickerMessages.push('');
  renderTicker();
  // Focus new input
  setTimeout(function() {
    var inputs = document.getElementById('tickerList').querySelectorAll('input');
    if (inputs.length) inputs[inputs.length - 1].focus();
  }, 50);
}

function removeTicker(i) {
  tickerMessages.splice(i, 1);
  renderTicker();
}

async function saveTicker() {
  // Read current values from DOM inputs
  // Read values directly from DOM in order
  var inputs = document.getElementById('tickerList').querySelectorAll('input[type=text]');
  var clean = [];
  inputs.forEach(function(inp) {
    if (inp.value.trim()) clean.push(inp.value.trim());
  });
  try {
    var res = await fetch('https://julyimages.sxrsq1.workers.dev/ticker', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: HOSTS[currentHost].password, messages: clean })
    });
    var data = await res.json();
    if (data.ok) {
      showMsg('tickerMsg', 'success', 'Ticker updated — live on overlay within 30 seconds');
      new BroadcastChannel('july').postMessage({ type: 'tickerUpdate' });
    }
    else showMsg('tickerMsg', 'error', 'Failed to save');
  } catch(e) { showMsg('tickerMsg', 'error', 'Connection error'); }
}

updateAdminClock();
